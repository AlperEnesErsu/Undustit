# Every pull request and every push to main: the site's texts, the database rules and the pages themselves.
# The site has no build; GitHub Pages serves the branch as it is. These checks only guard it.
name: Kontrol

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metin:
    name: Metinler (TR/EN sözlük)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/metin.py denetle --kati

  sql:
    name: Veritabanı (migration'lar ve erişim kuralları)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/sql/calistir.sh

  e2e:
    name: Sayfalar (Playwright, masaüstü ve telefon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapor
          path: test-results/
          retention-days: 7
