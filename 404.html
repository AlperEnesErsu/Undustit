<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undustit · Sayfa bulunamadı</title>
<meta name="description" content="Aradığın sayfa yok. Undustit ana sayfasına dön.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0C0D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230B0C0D%22/%3E%3Ctext x=%2232%22 y=%2246%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22 font-style=%22italic%22 font-size=%2240%22 fill=%22%23FF6A2B%22%3Eit%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: one plate of the drawing set, with the bolt missing from its hole. Tokens match index.html (see DESIGN.md). */
:root{
  color-scheme:dark;
  --bg:#0B0C0D; --bg-2:#111315; --bg-3:#171A1C; --line:#22262A; --line-2:#30353A;
  --ink:#EEECE7; --ink-2:#BFBDB6; --muted:#8F928E;
  --accent:#FF6A2B; --accent-hover:#FF8550; --accent-active:#E85A1E; --accent-ink:#170A04;
  --f-serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --dur-fast:100ms; --dur-base:200ms; --ease-out:cubic-bezier(0,0,.2,1);
  --gut:clamp(16px,4vw,56px);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
header,footer{padding:18px var(--gut);display:flex;justify-content:space-between;align-items:center;gap:12px}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.brand{text-decoration:none;color:inherit;font-family:var(--f-serif);font-size:25px;line-height:1}
.brand i{color:var(--accent);display:inline-block;transition:transform var(--dur-base) var(--ease-out)}
.brand:hover i{transform:translateX(2px) rotate(-6deg)}
main{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:clamp(32px,6vw,96px);align-items:center;max-width:1280px;width:100%;margin:0 auto;padding:clamp(48px,8vw,120px) var(--gut)}
.txt{display:grid;gap:24px;justify-items:start}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--f-serif);font-weight:400;font-size:clamp(52px,7vw,104px);line-height:.95;letter-spacing:-.03em;text-wrap:balance;max-width:12ch}
h1 em{color:var(--accent)}
p{margin:0;color:var(--ink-2);font-weight:300;font-size:18px;max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:500;font-size:15px;text-decoration:none;transition:background-color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.btn svg{width:18px;height:18px;transition:transform var(--dur-base) var(--ease-out)}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:hover svg{transform:translateX(-5px)}
.btn:active{transform:scale(.97);background:var(--accent-active)}
figure{margin:0;border:1px solid var(--line);border-radius:20px;background:radial-gradient(70% 70% at 50% 45%,rgba(255,236,214,.05),transparent 70%),var(--bg-2);padding:clamp(18px,2vw,28px)}
figure svg{width:100%;height:auto;display:block}
.s{fill:var(--bg-3);stroke:var(--ink-2);stroke-width:1.5}
.h{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 4}
.d{fill:none;stroke:var(--muted);stroke-width:1}
.t{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.t.k{fill:var(--accent)}
figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted)}
@view-transition{navigation:auto}
.brand{view-transition-name:brand}
footer a:hover{color:var(--accent)!important}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0ms!important}}
</style>
<header><a class="brand" href="/">Undust<i>it</i></a><span class="eyebrow">404</span></header>
<main>
  <div class="txt">
    <span class="eyebrow">Pafta yok · 404</span>
    <h1>Bu cıvata yerini <em>bulamadı.</em></h1>
    <p>Aradığın sayfa burada değil. Bir milyon cıvata ise hâlâ ana sayfada fikir bekliyor.</p>
    <a class="btn" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>Ana sayfaya dön</a>
  </div>
  <figure>
    <svg viewBox="0 0 320 200" role="img" aria-label="Cıvatası eksik bir bağlantı çizimi: iki levha, boş bir delik">
      <rect class="s" x="40" y="40" width="240" height="40" rx="2"/>
      <rect class="s" x="40" y="80" width="240" height="40" rx="2"/>
      <rect class="h" x="148" y="30" width="24" height="100"/>
      <line class="d" x1="160" y1="16" x2="160" y2="150" stroke-dasharray="10 3 2 3"/>
      <line class="d" x1="148" y1="160" x2="172" y2="160"/>
      <line class="d" x1="148" y1="152" x2="148" y2="168"/><line class="d" x1="172" y1="152" x2="172" y2="168"/>
      <text class="t" x="160" y="184" text-anchor="middle">Ø 11 mm</text>
      <text class="t k" x="184" y="24">M10 · yok</text>
    </svg>
    <figcaption><span>Detay ? · boş delik</span><span>Ölçek 1:1</span></figcaption>
  </figure>
</main>
<footer><span>Undustit · prototip</span><a href="/kucuk-fikirler/" style="color:var(--ink-2);display:inline-flex;align-items:center;min-height:44px">Hikâyeyi aç</a></footer>
