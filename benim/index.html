<style>
.benim{display:grid;gap:clamp(36px,5vw,64px);padding-bottom:clamp(56px,8vw,112px)}
.ozet3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ozet3 > div{display:grid;gap:4px;padding:16px 16px 16px 0}
.ozet3 > div + div{padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.ozet3 b{font-family:var(--f-serif);font-size:clamp(30px,3.4vw,46px);line-height:1;font-variant-numeric:tabular-nums}
.ozet3 span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hesap{display:grid;gap:12px;max-width:720px;padding:clamp(20px,3vw,30px);border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--bg-2)}
.hesap h2{font-size:clamp(24px,2.6vw,32px)}
.hesap p{color:var(--ink-2)}
.hesap form{display:flex;flex-wrap:wrap;gap:10px}
.hesap input{flex:1 1 240px;min-width:0;min-height:44px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 12px;background:var(--bg);font-size:15px}
.hesap input:focus{outline:none;border-color:var(--accent)}
.hesap .durum{font-size:14px;min-height:1.3em;color:var(--ink-2)}
.hesap .durum.bad{color:var(--err)}
.hesap .durum.ok{color:var(--ok)}
.hesap .ikinci{display:grid;gap:10px;padding-top:12px;border-top:1px dashed var(--line-2)}
.hesap small{color:var(--muted);font-size:13px}
.google-yer{display:grid;gap:10px;justify-items:start}
.blok{display:grid;gap:16px}
.blok h2{font-size:clamp(26px,3vw,38px)}
.haberler{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.haberler li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-2)}
.haberler small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (max-width:560px){.ozet3 > div{padding:12px 10px 12px 0}.ozet3 > div + div{padding-inline-start:10px}.ozet3 span{font-size:9.5px;letter-spacing:.04em}}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="benim.a.1">İçeriğe geç</a>
<header data-ud-nav></header>
<main id="main" tabindex="-1" class="wrap">
  <div class="phead">
    <span class="eyebrow" data-t="benim.span.1">Benim</span>
    <h1 data-t="benim.h1.1">Fikirlerin ve <em>talebin.</em></h1>
    <p class="lead" data-t="benim.p.1">Yazdığın fikirler, onlara kaç kişinin “alırdım” dediği, senin “alırdım” dediklerin ve hesabın.</p>
  </div>
  <div class="benim">
    <div class="ozet3" id="ozet" aria-live="polite"></div>
    <section class="hesap" id="hesap" aria-labelledby="hs-h"><h2 id="hs-h" data-t="benim.h2.1">Hesabın</h2><div id="hesap-ic"><p data-t="benim.p.2">Yükleniyor…</p></div></section>
    <section class="blok" aria-labelledby="fk-h"><h2 id="fk-h" data-t="benim.h2.2">Fikirlerin</h2><div id="fikirlerim"></div></section>
    <section class="blok" aria-labelledby="al-h"><h2 id="al-h" data-t="benim.h2.3">“Alırdım” dediklerin</h2><div id="alirdim"></div></section>
    <section class="blok" aria-labelledby="hb-h"><h2 id="hb-h" data-t="benim.h2.4">Haber beklediklerin</h2><div id="haberler"></div></section>
  </div>
</main>
<footer data-ud-foot></footer>
<script src="../assets/ayar.js"></script>
<script src="../assets/ud/temel.js"></script>
<script src="../assets/ud/depo.js"></script>
<script src="../assets/ud/arayuz.js"></script>
<script src="../assets/ud/hareket.js"></script>
<script>
// The person's own page: account, own ideas with their distance to Thursday, backed ideas, notices.
const { T, el, esc, ICON, ROOT, Store, LOCALE } = UD;
const DONUS = location.origin + location.pathname;   // the e-mail link and Google come back here
// Supabase reports a failed Google return in the address (?error_code=… or #error_code=…)
const GOOGLE_HATA = new URLSearchParams(location.search + '&' + location.hash.slice(1)).get('error_code') || '';
const benim = i => i.owner === Store.uid;

UD.mountBoard(document.getElementById('fikirlerim'), { dialog:true, hedef:true, sort:() => 'new', filter:benim, examples:false,
  emptyTitle:T('benim.js.bos.fikir'), emptyNote:T('benim.js.bos.fikir.not') });
UD.mountBoard(document.getElementById('alirdim'), { dialog:true, rank:false, filter:i => i.mine, examples:false,
  emptyTitle:T('benim.js.bos.alirdim'), emptyNote:T('benim.js.bos.alirdim.not') });

// three numbers: ideas written, the demand they gathered, ideas backed
Store.sub(() => {
  const list = Store.ideas(), mine = list.filter(benim);
  const rows = [[mine.length, T('benim.js.ozet.fikir')], [mine.reduce((t, i) => t + i.buyers, 0), T('benim.js.ozet.talep')], [list.filter(i => i.mine).length, T('benim.js.ozet.alirdim')]];
  document.getElementById('ozet').innerHTML = rows.map(([n, l]) => `<div><b>${n.toLocaleString(LOCALE)}</b><span>${l}</span></div>`).join('');
});

// "haber ver" requests, with a way to cancel each
let haberSira = 0;
function haberCiz(){
  const no = ++haberSira, kap = document.getElementById('haberler');
  Store.haberlerim().then(liste => {
    if (no !== haberSira) return;
    if (!liste.length){ kap.innerHTML = `<div class="empty"><b>${T('benim.js.bos.haber')}</b><p>${T('benim.js.bos.haber.not')}</p></div>`; return; }
    const ideas = Store.ideas();
    const ul = el('ul', { class:'haberler' });
    liste.forEach(h => {
      const i = ideas.find(x => x.key === h.idea);
      const ad = i ? el('a', { class:'link', href:ROOT + 'fikirler/?f=' + encodeURIComponent(i.key), text:i.title, onclick(e){ if (UD.openIdea(i.key)) e.preventDefault(); } }) : el('span', { text:T('benim.js.haber.yok') });
      const x = el('button', { type:'button', class:'link', text:T('benim.js.haber.iptal'), onclick(){ x.disabled = true; Store.haberIptal(h).then(haberCiz).catch(() => { x.disabled = false; }); } });
      ul.append(el('li', {}, [el('div', {}, [ad, el('br'), el('small', { text:T('benim.js.haber.' + h.tur) + ' · ' + h.eposta + (h.gonderildi ? ' · ' + T('benim.js.haber.gitti') : '') })]), x]));
    });
    kap.replaceChildren(ul);
  });
}

// the account card: preview mode, anonymous, waiting for the e-mail link, or signed in
function hesapCiz(){
  const kap = document.getElementById('hesap-ic');
  Store.hesap().then(h => {
    if (!h){ kap.innerHTML = `<p>${T('benim.js.yerel')}</p>`; return; }
    if (!h.anonim){
      kap.innerHTML = `<p>${T('benim.js.girdin', { eposta:'<b>' + esc(h.eposta) + '</b>' })}</p><div><button type="button" class="btn alt sm" id="cikis">${T('benim.js.cikis')}</button></div>`;
      kap.querySelector('#cikis').onclick = () => Store.cikis().then(hesapCiz);
      return;
    }
    if (h.bekleyen){ kap.innerHTML = `<p>${T('benim.js.bekliyor', { eposta:'<b>' + esc(h.bekleyen) + '</b>' })}</p>`; return; }
    kap.innerHTML = `<p>${h.var ? T('benim.js.anonim') : T('benim.js.yok')}</p>
      <div class="google-yer" hidden><button type="button" class="btn google" id="google">${ICON.google}<span>${T('benim.js.google')}</span></button><small class="ya">${T('benim.js.ya')}</small></div>
      <form id="bagla" novalidate><input type="email" name="e" autocomplete="email" maxlength="160" placeholder="${T('ud.haber.ipucu')}" aria-label="${T('ud.haber.eposta')}"><button type="submit" class="btn sig sm">${T('benim.js.bagla')}</button></form>
      <p class="durum" role="status" aria-live="polite"></p>
      <div class="ikinci"><button type="button" class="link" id="baska">${T('benim.js.baska')}</button></div>`;
    const durum = kap.querySelector('.durum');
    const say = (t, k) => { durum.textContent = t; durum.className = 'durum' + (k ? ' ' + k : ''); };
    const gecerli = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
    const hata = err => say(err && err.status === 429 ? T('benim.js.hata.sik') : T('benim.js.hata.genel'), 'bad');
    // one button: Google, when it is switched on in Supabase. Coming back with "this Google account already has
    // an account" offers to sign into that one instead.
    Store.googleAcik().then(acik => {
      if (!acik) return;
      kap.querySelector('.google-yer').hidden = false;
      const g = kap.querySelector('#google');
      const git = giris => { g.disabled = true; say(T('benim.js.gidiyor')); UD.olcu('Google ile devam'); Store.google(DONUS, giris).catch(err => { g.disabled = false; say(T('benim.js.hata.google'), 'bad'); }); };
      g.onclick = () => git(false);
      if (GOOGLE_HATA === 'identity_already_exists'){
        say(T('benim.js.google.bagli'), 'bad');
        durum.append(' ', el('button', { type:'button', class:'link', text:T('benim.js.google.gir'), onclick(){ git(true); } }));
      } else if (GOOGLE_HATA) say(T('benim.js.hata.google'), 'bad');
    });
    const f = kap.querySelector('#bagla');
    f.e.value =(() => { try { return localStorage.getItem('ud-eposta') || ''; } catch(e){ return ''; } })();
    f.onsubmit = e => {
      e.preventDefault();
      const v = f.e.value.trim();
      if (!gecerli(v)){ say(T('ud.haber.hata.eposta'), 'bad'); f.e.focus(); return; }
      f.querySelector('button').disabled = true; say(T('benim.js.gidiyor'));
      Store.epostaBagla(v, DONUS).then(() => { UD.olcu('Hesap bağla'); say(T('benim.js.gonderildi', { eposta:v }), 'ok'); })
        .catch(err => { f.querySelector('button').disabled = false; hata(err); });
    };
    // signing in to an account made elsewhere leaves this browser's anonymous contributions behind, so say so
    kap.querySelector('#baska').onclick = () => {
      const ik = kap.querySelector('.ikinci');
      ik.innerHTML = `<small>${T('benim.js.baska.not')}</small>
        <form novalidate><input type="email" name="e" autocomplete="email" maxlength="160" placeholder="${T('ud.haber.ipucu')}" aria-label="${T('ud.haber.eposta')}"><button type="submit" class="btn alt sm">${T('benim.js.giris')}</button></form>`;
      const g = ik.querySelector('form'); g.e.focus();
      g.onsubmit = e => {
        e.preventDefault();
        const v = g.e.value.trim();
        if (!gecerli(v)){ say(T('ud.haber.hata.eposta'), 'bad'); g.e.focus(); return; }
        g.querySelector('button').disabled = true; say(T('benim.js.gidiyor'));
        Store.girisBaglantisi(v, DONUS).then(() => say(T('benim.js.gonderildi', { eposta:v }), 'ok'))
          .catch(err => { g.querySelector('button').disabled = false; hata(err); });
      };
    };
  });
}

// the store tells us when "I" change (signed in, out, back from the e-mail link)
let kim = null;
Store.sub(() => { if (Store.uid !== kim){ kim = Store.uid; hesapCiz(); haberCiz(); } });
</script>
</body>
