<style>
/* Style board: one page of the site in every style at once. Pick the page and the device on top;
   each preview is the live site, and opening one makes it full size and usable. */
.board-bar{position:sticky;top:64px;z-index:6;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px;margin-bottom:28px;background:var(--bg);border-block:1px solid var(--line)}
.board-bar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.board-bar .grp > span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px}
.seg button{min-height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:14px;color:var(--ink-2);transition:all var(--dur-fast) var(--ease-out)}
.seg button:hover{color:var(--ink);background:var(--bg-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.styles{display:grid;gap:20px}
.styles.desk{grid-template-columns:repeat(2,minmax(0,1fr))}
.styles.phone{grid-template-columns:repeat(2,minmax(200px,1fr));overflow-x:auto;padding-bottom:8px}
.style{display:grid;gap:12px;align-content:start;padding:12px 12px 16px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--bg-2);transition:border-color var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.style:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.style header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-inline:6px}
.style h2{font-size:clamp(24px,2.2vw,32px)}
.style p{color:var(--muted);font-size:13.5px;padding-inline:6px;max-width:60ch}
.thumb{position:relative;display:block;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg-3);cursor:zoom-in;padding:0}
.desk .thumb{aspect-ratio:16/10}
html[lang="en"] .thumb{--buyut:"Enlarge"}
.phone .thumb{aspect-ratio:390/760;border-radius:24px}
.thumb iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.thumb::after{content:var(--buyut,"Büyüt");position:absolute;right:10px;bottom:10px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:12.5px;opacity:0;transform:translateY(4px);transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}
.thumb:hover::after,.thumb:focus-visible::after{opacity:1;transform:none}
.style .acts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-inline:6px}
dialog.view{width:min(1480px,100% - 24px);height:calc(100dvh - 24px);max-height:none;padding:0;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--bg-2);color:var(--ink);overflow:hidden}
dialog.view[open]{display:grid;grid-template-rows:auto minmax(0,1fr);animation:dlg var(--dur-mod) var(--ease-out)}
dialog.view::backdrop{background:rgba(10,10,12,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog.view header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px 10px 20px;border-bottom:1px solid var(--line)}
dialog.view header b{font-family:var(--f-serif);font-weight:400;font-size:24px}
dialog.view .stage{display:grid;place-items:center;overflow:auto;background:var(--bg-3)}
dialog.view iframe{display:block;border:0;background:#fff;width:100%;height:100%}
dialog.view.is-phone iframe{width:390px;height:min(844px,100%);border-radius:24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.x{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-2);background:transparent;display:inline-flex;align-items:center;justify-content:center}
.x:hover{border-color:var(--ink)}
.x svg{width:18px;height:18px}
@media (max-width:900px){.styles.desk{grid-template-columns:minmax(0,1fr)}.board-bar{position:static}}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="stiller.a.1">İçeriğe geç</a>
<header data-ud-nav></header>
<main id="main" tabindex="-1" class="wrap">
  <div class="phead">
    <span class="eyebrow" data-t="stiller.span.1">Stil örnekleri</span>
    <h1 data-t="stiller.h1.1">Aynı site, <em>iki stil.</em></h1>
    <p class="lead" data-t="stiller.p.1">Bir sayfa seç, iki stilde yan yana gör. Önizlemelerin hepsi canlı site; birine tıklayınca büyür, içinde gezinip animasyonları oynatabilirsin. Her biri ayrı bir site olarak da açılır.</p>
  </div>
  <div class="board-bar" role="toolbar" aria-label="Görünüm seçimi" data-ta="aria-label:stiller.attr.3">
    <div class="grp"><span id="pg-l" data-t="stiller.span.2">Sayfa</span><div class="seg" role="group" aria-labelledby="pg-l" id="pages"></div></div>
    <div class="grp"><span id="dv-l" data-t="stiller.span.3">Cihaz</span><div class="seg" role="group" aria-labelledby="dv-l" id="devices"></div>
      <button type="button" class="btn alt sm" id="replay" data-t="stiller.button.1">Hepsini yeniden oynat</button></div>
  </div>
  <div class="styles desk" id="styles"></div>
</main>
<footer data-ud-foot></footer>
<dialog class="view" id="view" aria-labelledby="view-h">
  <header><b id="view-h"></b><div style="display:flex;gap:10px;align-items:center"><a class="btn sm alt" id="view-open" data-stil-link target="_blank" rel="noopener" data-t="stiller.a.2">Yeni sekmede aç</a><button type="button" class="x" id="view-x" aria-label="Kapat" data-ta="aria-label:stiller.attr.4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div></header>
  <div class="stage"><iframe id="view-f" title="Büyük önizleme" data-ta="title:stiller.attr.5"></iframe></div>
</dialog>
<script src="../assets/ayar.js"></script>
<script src="../assets/ud/temel.js"></script>
<script src="../assets/ud/depo.js"></script>
<script src="../assets/ud/arayuz.js"></script>
<script src="../assets/ud/hareket.js"></script>
<script>
const STYLES = [
  ['oyuncu',UD.T('ud.stil.oyuncu'),UD.T('stiller.js.oyuncu')],
  ['kagit',UD.T('ud.stil.kagit'),UD.T('stiller.js.kagit')]
];
const PAGES = [['', UD.T('stiller.js.anasayfa')], ['fikir/', UD.T('ud.menu.yaz')], ['fikirler/', UD.T('ud.menu.fikirler')], ['nasil/', UD.T('ud.menu.nasil')], ['vakalar/', UD.T('ud.menu.vakalar')], ['vaka-01/', 'Vaka 01'], ['hikaye/', UD.T('ud.menu.hikaye')]];
const DEVICES = [['masaustu', UD.T('stiller.js.masaustu'), 1440, 900], ['telefon', UD.T('stiller.js.telefon'), 390, 760]];
const q = new URLSearchParams(location.search);
let page = PAGES.some(p => p[0] === q.get('sayfa')) ? q.get('sayfa') : '';
let device = q.get('cihaz') === 'telefon' ? 'telefon' : 'masaustu';
const urlFor = (k) => UD_STIL.withStil('../' + page, k);
const host = document.getElementById('styles');

function seg(id, items, current, set){
  const g = document.getElementById(id); g.replaceChildren();
  items.forEach(([k, l]) => g.append(UD.el('button', { type:'button', 'aria-pressed': String(k === current), text:l, onclick(){ set(k); } })));
}
function fit(){
  const d = DEVICES.find(x => x[0] === device);
  host.querySelectorAll('.thumb').forEach(t => { const f = t.querySelector('iframe'); f.style.width = d[2] + 'px'; f.style.height = d[3] + 'px'; f.style.transform = `scale(${t.clientWidth / d[2]})`; });
}
function render(){
  seg('pages', PAGES, page, k => { page = k; sync(); });
  seg('devices', DEVICES, device, k => { device = k; sync(); });
  host.className = 'styles ' + (device === 'telefon' ? 'phone' : 'desk');
  host.replaceChildren();
  const pageName = PAGES.find(p => p[0] === page)[1];
  STYLES.forEach(([k, name, about]) => {
    const href = urlFor(k);
    const card = UD.el('article', { class:'style' });
    card.innerHTML = `<header><h2>${name}</h2><span class="eyebrow">${pageName}</span></header>
      <button type="button" class="thumb" aria-label="${UD.T('stiller.js.buyut', { stil:name, sayfa:pageName })}"><iframe src="${href}" title="${UD.T('stiller.js.onizleme', { stil:name })}" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></button>
      <p>${about}</p>
      <div class="acts"><a class="link" data-stil-link target="_blank" rel="noopener">${UD.T('stiller.js.yeni')}</a></div>`;
    card.querySelector('.acts a').href = href;
    card.querySelector('.thumb').onclick = () => openView(k, name, pageName, href);
    host.append(card);
  });
  fit();
}
function sync(){
  const u = new URL(location.href);
  page ? u.searchParams.set('sayfa', page) : u.searchParams.delete('sayfa');
  device === 'telefon' ? u.searchParams.set('cihaz', 'telefon') : u.searchParams.delete('cihaz');
  history.replaceState(null, '', u.pathname + u.search);
  render();
}
const view = document.getElementById('view'), viewF = document.getElementById('view-f');
function openView(k, name, pageName, href){
  document.getElementById('view-h').textContent = `${name} · ${pageName}`;
  document.getElementById('view-open').href = href;
  view.classList.toggle('is-phone', device === 'telefon');
  viewF.src = href; view.showModal();
}
document.getElementById('view-x').onclick = () => view.close();
view.addEventListener('click', e => { if (e.target === view) view.close(); });
view.addEventListener('close', () => { viewF.src = 'about:blank'; });
document.getElementById('replay').onclick = () => host.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
window.addEventListener('resize', fit);
render();
</script>
</body>
</html>
