<!doctype html>
<html lang="tr" data-root="../" data-page="vaka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title data-t="vakasayfa.title.1">Vaka · Undustit</title>
<meta name="description" content="Undustit vakası: bir üretici, bir stok ve bir soru. Fikrini yaz, talebi birlikte ölçelim." data-ta="content:vakasayfa.attr.1">
<meta name="theme-color" content="#FFF6E9">
<link rel="stylesheet" href="../assets/fonts/base.css">
<link rel="stylesheet" href="../assets/ud.css">
<link rel="stylesheet" href="../assets/bilesen.css">
<script src="../assets/stil.js"></script>
<style>
/* Veriden beslenen vaka sayfası: yalnız bu sayfanın düzeni. */
.vaka-sayfa{padding-block:clamp(28px,4.5vw,64px) clamp(40px,5vw,72px)}
.vaka-ust{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.vaka-sayfa h1{font-size:clamp(38px,5vw,72px);line-height:.98;letter-spacing:-.03em;max-width:18ch;overflow-wrap:anywhere}
.vaka-bilgi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:8px 0 0;border-top:1px solid var(--line);width:100%}
.vaka-bilgi > div{padding:12px 16px 0 0;display:grid;gap:2px;min-width:0}
.vaka-bilgi > div + div{padding-inline-start:16px;border-inline-start:1px solid var(--line)}
.vaka-bilgi dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.vaka-bilgi dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.vaka-metin{max-width:68ch;display:grid;gap:12px;color:var(--ink-2);font-weight:300}
.vaka-gorsel{margin:0;max-width:420px}
.vaka-gorsel img{display:block;width:100%;height:auto;border-radius:var(--r-md);border:1px solid var(--line)}
.vaka-detay{margin-top:clamp(32px,4vw,56px);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.vaka-detay summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:500;display:flex;justify-content:space-between;gap:12px}
.vaka-detay summary::-webkit-details-marker{display:none}
.vaka-detay summary::after{content:"+";font-family:var(--f-mono);font-size:22px;line-height:1;color:var(--accent)}
.vaka-detay[open] summary::after{content:"–"}
.vaka-detay summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.vaka-detay-in{display:grid;gap:20px;padding-bottom:24px}
.vaka-sayfa .phead{padding-top:0}
.vaka-yaz{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,72px);align-items:start}
.vaka-yaz > div{display:grid;gap:16px;align-content:start}
@media (max-width:980px){.vaka-yaz{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.vaka-bilgi{grid-template-columns:repeat(2,minmax(0,1fr))}.vaka-bilgi > div:nth-child(3){padding-inline-start:0;border-inline-start:0}}
</style>
</head>
<body>
<a class="skip" href="#main" data-t="vakasayfa.a.1">İçeriğe geç</a>
<header data-ud-nav></header>
<main id="main" tabindex="-1">
  <div class="wrap vaka-sayfa" id="kabuk">
    <p class="lead" data-t="vakasayfa.p.1">Yükleniyor…</p>
  </div>
</main>
<footer data-ud-foot></footer>

<script src="../assets/ayar.js"></script>
<script src="../assets/ud.js"></script>
<script src="../assets/veri.js"></script>
<script>
(function(){
'use strict';
// A case opened from the admin panel: its facts, the idea form while it is open, and the ideas it got.
var T = UD.T, esc = UD.esc;
var kap = document.getElementById('kabuk');
var id = (new URLSearchParams(location.search).get('id') || '').trim();

function sayi(v){
  return v == null || v === '' || !isFinite(Number(v)) || !Number(v) ? '—' : Number(v).toLocaleString(UD.LOCALE);
}

function bulunamadi(){
  document.title = T('vakasayfa.js.yok') + ' · Undustit';
  kap.innerHTML = '<div class="bos"><b>' + T('vakasayfa.js.yok') + '</b>' +
    '<p>' + T('vakasayfa.js.yok.not') + '</p>' +
    '<a class="btn sig sm" href="../vakalar/">' + T('vakasayfa.js.don') + '</a></div>';
}

function ciz(v){
  var acik = v.durum === 'acik';
  var vaka = { id: v.id, short: String(v.baslik).slice(0, 40) };
  document.title = v.baslik + ' · Undustit';
  var paragraflar = String(v.aciklama || '').split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean);
  var gorsel = /^https?:\/\//i.test(v.gorsel || '') ? v.gorsel : '';

  kap.innerHTML =
    '<section class="phead" aria-labelledby="vb">' +
      '<div class="vaka-ust"><span class="eyebrow">' + T('vakasayfa.js.vaka') + '</span>' +
        '<span class="rozet" data-durum="' + esc(v.durum) + '">' + T('ud.durum.' + v.durum) + '</span></div>' +
      '<h1 id="vb">' + esc(v.baslik) + '</h1>' +
      (v.ozet ? '<p class="lead">' + esc(v.ozet) + '</p>' : '') +
      '<dl class="vaka-bilgi">' +
        '<div><dt>' + T('vakasayfa.js.adet') + '</dt><dd>' + sayi(v.adet) + '</dd></div>' +
        '<div><dt>' + T('vakasayfa.js.olcu') + '</dt><dd>' + esc([v.olcu, v.sinif].filter(Boolean).join(' · ') || '—') + '</dd></div>' +
        '<div><dt>' + T('vakasayfa.js.deneme') + '</dt><dd>' + (v.deneme_adedi ? T('vakasayfa.js.deneme.adet', { n: sayi(v.deneme_adedi) }) : '—') + '</dd></div>' +
        '<div><dt>' + T('vakasayfa.js.gelen') + '</dt><dd id="n-fikir">0</dd></div>' +
      '</dl>' +
      (acik ? '' : '<p class="lead" style="font-size:15px">' + T('vakasayfa.js.kapali') + '</p>') +
    '</section>' +
    '<section class="vaka-yaz" id="yaz" aria-label="' + T('vakasayfa.js.fikirler') + '">' +
      (acik ? '<div><span class="eyebrow">' + T('vakasayfa.js.sira') + '</span><div id="form"></div></div>' : '') +
      '<div><span class="eyebrow">' + T('vakasayfa.js.fikirler') + '</span><div id="board"></div></div>' +
    '</section>' +
    // the long description and the photo come after the form, folded
    (gorsel || paragraflar.length ? '<details class="vaka-detay"><summary>' + T('vakasayfa.js.detay') + '</summary><div class="vaka-detay-in">' +
      (gorsel ? '<figure class="vaka-gorsel"><img src="' + esc(gorsel) + '" alt="' + esc(v.baslik) + '" loading="lazy"></figure>' : '') +
      (paragraflar.length ? '<div class="vaka-metin">' + paragraflar.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' : '') +
    '</div></details>' : '');

  if (acik) UD.mountForm(document.getElementById('form'), { caseId: v.id });
  UD.mountBoard(document.getElementById('board'), { filter: function(i){ return UD.inCase(i, vaka); }, examples: false,
    emptyTitle: T('vakasayfa.js.bos'), emptyNote: acik ? T('vakasayfa.js.bos.not') : '' });
  UD.Store.sub(function(){
    document.getElementById('n-fikir').textContent = String(UD.Store.ideas().filter(function(i){ return UD.inCase(i, vaka); }).length);
  });
}

function hataGoster(err){
  kap.innerHTML = '<div class="bos"><b>' + T('vakasayfa.js.hata') + '</b><p>' + esc(err && err.message) + '</p>' +
    '<a class="btn alt sm" href="../vakalar/">' + T('vakasayfa.js.don') + '</a></div>';
}

if (!id){
  bulunamadi();
} else {
  Promise.resolve(UDV.hazir)
    .then(function(){ return UDV.vakalar.al(id); })
    .then(function(v){
      if (!v || v.durum === 'taslak') return bulunamadi();
      ciz(v);
    })
    .catch(hataGoster);
}
})();
</script>
</body>
</html>
