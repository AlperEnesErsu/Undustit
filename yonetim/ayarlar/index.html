<!doctype html>
<html lang="tr" data-root="../../" data-page="yonetim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F3">
<title>Ayarlar · Yönetim · Undustit</title>
<link rel="stylesheet" href="../../assets/fonts/base.css">
<link rel="stylesheet" href="../../assets/ud.css">
<link rel="stylesheet" href="../../assets/bilesen.css">
<script src="../../assets/stil.js"></script>
<style>
/* Ayarlar: sitede görünen etkinlikler ve yöneticinin giriş bilgileri. Bileşenler bilesen.css'ten gelir. */
.y-ust{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.y-ust h1{font-size:clamp(30px,3.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0}
.y-ust p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:64ch}
.panel + .panel{margin-top:20px}
.sayac{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ka-form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.ka-form .alan{flex:1 1 260px;max-width:420px;margin:0}
.ka-durum{margin:12px 0 0;color:var(--ink-2);font-size:14.5px}
.y-etkinlik{display:grid;gap:18px}
.et-form{display:grid;gap:12px}
.et-ac summary{cursor:pointer;width:max-content;list-style:none}
.et-ac summary::-webkit-details-marker{display:none}
.et-ac[open] summary{margin-bottom:14px}
.et-liste{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-2)}
.et-liste li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px}
.et-liste li + li{border-top:1px solid var(--line)}
.et-liste li div{display:grid;gap:2px;min-width:0}
.et-liste small{color:var(--muted);font-size:13px}
.et-liste li.bitti b{color:var(--muted)}
.et-liste .bos-satir{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body class="yonetim">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="y-bas">
  <div class="y-kimlik" style="display:flex;align-items:center;gap:12px;min-width:0">
    <a class="link" href="../../" style="font-weight:500;color:var(--ink);text-decoration:none">Undustit</a>
    <span style="color:var(--muted);font-size:14px">Yönetim</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
    <span data-y-kim style="font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw"></span>
    <button type="button" class="btn alt sm" data-y-cikis hidden>Çıkış</button>
  </div>
</header>
<div class="y-govde">
  <nav class="y-yan" aria-label="Yönetim menüsü" data-y-menu="ayarlar"></nav>
  <main id="main" class="y-ana" tabindex="-1"><p class="lead">Yükleniyor…</p></main>
</div>

<script src="../../assets/ayar.js"></script>
<script src="../../assets/ud/db.js"></script>
<script src="../../assets/ud/temel.js"></script>
<script src="../../assets/ud/depo.js"></script>
<script src="../../assets/ud/arayuz.js"></script>
<script src="../../assets/ud/hareket.js"></script>
<script src="../../assets/veri.js"></script>
<script src="../yonetim.js"></script>
<script>
(function(){
'use strict';
var YON = window.YONETIM;
var esc = YON.esc;
var ana = null;

function ciz(o, a){
  ana = a;
  ana.innerHTML =
    '<div class="y-ust"><div><span class="eyebrow">Yönetim</span><h1>Ayarlar</h1>' +
      '<p>Sitede sayfaların üstünde geri sayımla görünen etkinlikler ve senin giriş bilgilerin.</p></div></div>' +
    etkinlikHtml() +
    '<section class="panel" id="hesap" aria-labelledby="hs-b"><header class="panel-bas"><h2 id="hs-b">Giriş bilgileri</h2></header>' +
      '<div class="panel-ic"><form id="ka-form" class="ka-form" novalidate>' +
        '<label class="alan"><span>Kullanıcı adı <small>3–24 karakter: küçük harf, rakam, nokta, alt çizgi</small></span>' +
        '<input type="text" name="ad" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ör. alper"></label>' +
        '<button class="btn sig" type="submit">Kaydet</button></form>' +
      '<p class="ka-durum" id="ka-durum" aria-live="polite"></p></div></section>';
  hesapBagla(o);
  etkinlikBagla();
}

// ----------------------------------------------------------- etkinlikler
// Yayın, atölye, buluşma: buraya eklenen sıradaki etkinlik sitede sayfaların üstünde geri sayımla görünür.
function etkinlikHtml(){
  return '<section class="panel" id="etkinlikler" aria-labelledby="et-b">' +
    '<header class="panel-bas"><h2 id="et-b">Etkinlikler</h2><span class="sayac" id="et-sayac"></span></header>' +
    '<div class="panel-ic y-etkinlik">' +
      '<ul class="et-liste" id="et-liste" aria-live="polite"></ul>' +
      '<details class="et-ac" id="et-ac"><summary class="btn alt sm">Etkinlik ekle</summary>' +
      '<form id="et-form" class="et-form" novalidate>' +
        '<label class="alan"><span>Başlık</span><input type="text" name="baslik" maxlength="120" required placeholder="Ör. Ekim değerlendirme yayını"></label>' +
        '<div class="alan-iki"><label class="alan"><span>Başlangıç</span><input type="datetime-local" name="baslangic" required></label>' +
          '<label class="alan"><span>Bitiş <small>boşsa 2 saat</small></span><input type="datetime-local" name="bitis"></label></div>' +
        '<label class="alan"><span>Bağlantı <small>yayın, toplantı ya da kayıt sayfası; https://</small></span><input type="url" name="baglanti" maxlength="500" placeholder="https://"></label>' +
        '<label class="alan"><span>Açıklama <small>isteğe bağlı, en çok 600 karakter</small></span><textarea name="aciklama" rows="2" maxlength="600"></textarea></label>' +
        '<div class="y-eylem"><button class="btn sig" type="submit">Kaydet</button></div>' +
      '</form></details>' +
    '</div></section>';
}
function etkinlikYenile(){
  var ul = ana.querySelector('#et-liste'), simdi = Date.now();
  return UDV.etkinlik.liste().then(function(l){
    ana.querySelector('#et-sayac').textContent = l.length + ' etkinlik';
    ul.innerHTML = l.length ? l.map(function(e){
      var bitti = Date.parse(e.bitis || e.baslangic) + (e.bitis ? 0 : 72e5) < simdi;
      return '<li' + (bitti ? ' class="bitti"' : '') + '><div><b>' + esc(e.baslik) + '</b><small>' + esc(YON.tarihSaat(e.baslangic)) + (bitti ? ' · geçti' : '') +
        (e.baglanti ? ' · <a href="' + esc(e.baglanti) + '" target="_blank" rel="noopener">bağlantı</a>' : '') + '</small></div>' +
        '<button type="button" class="btn alt sm" data-et-sil="' + esc(e.id) + '">Sil</button></li>';
    }).join('') : '<li class="bos-satir">Henüz etkinlik yok. Eklediğinizde sitede sayfaların üstünde görünür.</li>';
  }).catch(function(err){ ul.innerHTML = ''; YON.toast(err.message || 'Etkinlikler yüklenemedi.', 'hata'); });
}
function etkinlikBagla(){
  var f = ana.querySelector('#et-form');
  // datetime-local is the admin's local time; the database keeps an exact instant
  var an = function(v){ return v ? new Date(v).toISOString() : null; };
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var b = f.querySelector('[type=submit]'); b.disabled = true;
    UDV.etkinlik.ekle({ baslik:f.baslik.value, baslangic:an(f.baslangic.value), bitis:an(f.bitis.value), baglanti:f.baglanti.value.trim(), aciklama:f.aciklama.value })
      .then(function(){ f.reset(); ana.querySelector('#et-ac').open = false; YON.toast('Etkinlik eklendi.', 'ok'); return etkinlikYenile(); })
      .catch(function(err){ YON.toast(err.message || 'Eklenemedi.', 'hata'); })
      .then(function(){ b.disabled = false; });
  });
  ana.querySelector('#et-liste').addEventListener('click', function(e){
    var s = e.target.closest('[data-et-sil]');
    if (!s) return;
    YON.onay({ baslik:'Etkinlik silinsin mi?', metin:'Sitede artık görünmez.', eylem:'Sil', tehlike:true }).then(function(evet){
      if (!evet) return;
      return UDV.etkinlik.sil(s.dataset.etSil).then(function(){ YON.toast('Etkinlik silindi.', 'ok'); return etkinlikYenile(); });
    }).catch(function(err){ YON.toast(err.message || 'Silinemedi.', 'hata'); });
  });
  etkinlikYenile();
}
// The admin's username: an easier thing to type than the address when signing in. The line under the field
// always says what signs in right now, read back from the database after every save.
function hesapBagla(o){
  var f = ana.querySelector('#ka-form'), d = ana.querySelector('#ka-durum');
  var yaz = function(ad){
    f.ad.value = ad || '';
    d.innerHTML = ad
      ? 'Şu an <b>' + esc(ad) + '</b> kullanıcı adıyla ya da <b>' + esc(o.email) + '</b> adresiyle giriş yapabilirsin. Şifre aynı.'
      : 'Henüz kullanıcı adın yok: yalnız <b>' + esc(o.email) + '</b> adresiyle giriş yapıyorsun.';
  };
  UDV.hesap.kullaniciAdi().then(yaz).catch(function(err){ d.textContent = err.message || 'Kullanıcı adı okunamadı.'; });
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var b = f.querySelector('[type=submit]'); b.disabled = true;
    UDV.hesap.kullaniciAdiKoy(f.ad.value).then(function(){ return UDV.hesap.kullaniciAdi(); })
      .then(function(ad){ yaz(ad); YON.toast(ad ? 'Kullanıcı adı kaydedildi.' : 'Kullanıcı adı kaldırıldı.', 'ok'); })
      .catch(function(err){ YON.toast(err.message || 'Kaydedilemedi.', 'hata'); })
      .then(function(){ b.disabled = false; });
  });
}

YON.guard(ciz);
})();
</script>
</body>
</html>
