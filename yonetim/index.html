<!doctype html>
<html lang="tr" data-root="../" data-page="yonetim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF6E9">
<title>Yönetim · Undustit</title>
<link rel="stylesheet" href="../assets/fonts/base.css">
<link rel="stylesheet" href="../assets/ud.css">
<link rel="stylesheet" href="../assets/bilesen.css">
<script src="../assets/stil.js"></script>
<style>
/* Yönetim özeti: yalnız bu sayfanın düzeni. Bileşenler bilesen.css'ten gelir. */
.y-ust{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.y-ust h1{font-size:clamp(30px,3.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0}
.panel + .panel{margin-top:20px}
.y-ara{width:100%}
.y-ara.arama{flex:1 1 220px}
.chipler{display:flex;flex-wrap:wrap;gap:6px}
.sayac{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablo td a{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.tablo td a:hover{text-decoration-color:var(--ink)}
.tablo td.bosluk{padding:0}
.tablo .bos{margin:0;border:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){.y-ust{align-items:stretch}.y-ust .btn{width:100%}}
</style>
</head>
<body class="yonetim">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="y-bas">
  <div class="y-kimlik" style="display:flex;align-items:center;gap:12px;min-width:0">
    <a class="link" href="../" style="font-weight:500;color:var(--ink);text-decoration:none">Undustit</a>
    <span style="color:var(--muted);font-size:14px">Yönetim</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
    <span data-y-kim style="font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw"></span>
    <button type="button" class="btn alt sm" data-y-cikis hidden>Çıkış</button>
  </div>
</header>
<div class="y-govde">
  <nav class="y-yan" aria-label="Yönetim menüsü">
    <a href="./" aria-current="page">Özet</a>
    <a href="./#vakalar">Vakalar</a>
    <a href="vaka/">Yeni vaka</a>
    <a href="../">Siteye dön</a>
  </nav>
  <main id="main" class="y-ana" tabindex="-1"><p class="lead">Yükleniyor…</p></main>
</div>

<script src="../assets/ayar.js"></script>
<script src="../assets/ud.js"></script>
<script src="../assets/veri.js"></script>
<script src="yonetim.js"></script>
<script>
(function(){
'use strict';
var YON = window.YONETIM;
var esc = YON.esc, sayi = YON.sayi, tarih = YON.tarih;
var filtre = { durum: '', ara: '' };
var istek = 0, aramaZamani = null;
var ana = null;

function $(s){ return ana.querySelector(s); }

function ciz(o, a){
  ana = a;
  var chipler = [['', 'Tümü']].concat(UDV.DURUMLAR.map(function(d){ return [d, UDV.DURUM_ADI[d]]; })).map(function(p){
    return '<button type="button" class="chip" data-durum="' + esc(p[0]) + '" aria-pressed="' + (filtre.durum === p[0]) + '">' + esc(p[1]) + '</button>';
  }).join('');

  ana.innerHTML =
    '<div class="y-ust"><div><span class="eyebrow">Yönetim</span><h1>Özet</h1></div></div>' +
    '<div class="istatlar" id="istatlar" aria-live="polite"></div>' +
    '<section class="panel" id="vakalar" aria-labelledby="vk-b">' +
      '<header class="panel-bas"><h2 id="vk-b">Vakalar</h2><span class="sayac" id="sayac"></span></header>' +
      '<div class="panel-ic">' +
        '<div class="arac-cubugu">' +
          '<div class="sol">' +
            '<input class="y-ara" type="search" id="ara" placeholder="Başlık, firma, stok" aria-label="Vaka ara" value="' + esc(filtre.ara) + '">' +
            '<div class="chipler" role="group" aria-label="Duruma göre filtrele">' + chipler + '</div>' +
          '</div>' +
          '<div class="sag"><a class="btn sig sm" href="vaka/">Yeni vaka</a></div>' +
        '</div>' +
        '<div class="tablo-kap"><table class="tablo">' +
          '<caption class="sr-only">Vakalar</caption>' +
          '<thead><tr><th scope="col">Başlık</th><th scope="col">Firma</th><th scope="col">Durum</th>' +
          '<th scope="col" class="sayi">Adet</th><th scope="col" class="sayi">Fikir</th>' +
          '<th scope="col">Açılış</th><th scope="col">Güncelleme</th></tr></thead>' +
          '<tbody id="tbody"></tbody>' +
        '</table></div>' +
      '</div>' +
    '</section>' +
    KAYITLAR.map(panelHtml).join('');

  KAYITLAR.forEach(function(k){
    ana.querySelector('#' + k.id + '-tbody').addEventListener('change', function(e){
      var sec = e.target.closest('select[data-kayit]');
      if (!sec) return;
      sec.disabled = true;
      Promise.resolve(k.degisince ? k.degisince(sec.dataset.kayit, sec.value, sec) : null)
        .then(function(){ return UDV[k.tur].durum(sec.dataset.kayit, sec.value); })
        .then(function(){ YON.toast(k.tamam, 'ok'); })
        .catch(function(err){ YON.toast(err.message || 'Kaydedilemedi.', 'hata'); kayitYenile(k); })
        .then(function(){ sec.disabled = false; });
    });
  });

  ana.querySelector('.chipler').addEventListener('click', function(e){
    var b = e.target.closest('[data-durum]');
    if (!b) return;
    filtre.durum = b.dataset.durum;
    $$chip();
    yenile();
  });
  $('#ara').addEventListener('input', function(e){
    clearTimeout(aramaZamani);
    aramaZamani = setTimeout(function(){
      filtre.ara = e.target.value.trim();
      yenile();
    }, 200);
  });

  istatYenile();
  yenile();
  KAYITLAR.forEach(kayitYenile);
}

// Sitenin yalnız yöneticiye gelen kayıtları: başvurular, mesajlar, bildirimler. Yeni olanlar üstte, durum satırdan değişir.
var KONU = { genel:'Genel', ortaklik:'İş birliği', basin:'Basın', yatirim:'Yatırım' };
var NEDEN = { spam:'Spam', uygunsuz:'Uygunsuz', kopya:'Kopya', yaniltici:'Yanıltıcı', diger:'Diğer' };
function posta(e){ return '<a class="link" href="mailto:' + encodeURIComponent(e).replace(/%40/g, '@') + '">' + esc(e) + '</a>'; }
var KAYITLAR = [
  { id:'bildirimler', tur:'bildirimler', baslik:'Bildirilen fikirler', ad:'bildirim', bos:'Bildirilen fikir yok.', tamam:'Bildirim kaydedildi.',
    kolon:['Fikir','Neden','Açıklama','Tarih'],
    etiket:function(b){ return (b.fikirler && b.fikirler.baslik) || 'Fikir'; },
    satir:function(b){ return ['<b>' + esc((b.fikirler && b.fikirler.baslik) || b.fikir_id) + '</b>', esc(NEDEN[b.neden] || b.neden), esc(b.aciklama || '—'), tarih(b.zaman)]; },
    // "Fikir gizlendi" fikri sitede gizler; başka bir duruma dönmek gizliliği kaldırır
    degisince:function(id, durum, sec){ var fid = sec.dataset.fikir; return fid ? UDV.fikirler.gizle(fid, durum === 'gizlendi') : null; } },
  { id:'basvurular', tur:'basvurular', baslik:'Vaka başvuruları', ad:'başvuru', bos:'Henüz başvuru yok.', tamam:'Başvuru durumu kaydedildi.',
    kolon:['Firma','Stok','Adet','İletişim','Not','Tarih'],
    etiket:function(b){ return b.firma; },
    satir:function(b){ return ['<b>' + esc(b.firma) + '</b>' + (b.kisi ? '<br><small>' + esc(b.kisi) + '</small>' : ''), esc(b.stok), esc(b.adet || '—'),
      posta(b.eposta) + (b.telefon ? '<br><small>' + esc(b.telefon) + '</small>' : ''), esc(b.notlar || '—'), tarih(b.zaman)]; } },
  { id:'mesajlar', tur:'mesajlar', baslik:'İletişim mesajları', ad:'mesaj', bos:'Henüz mesaj yok.', tamam:'Mesaj durumu kaydedildi.',
    kolon:['Kimden','Konu','Mesaj','Tarih'],
    etiket:function(b){ return b.eposta; },
    satir:function(b){ return [(b.ad ? '<b>' + esc(b.ad) + '</b><br>' : '') + posta(b.eposta), esc(KONU[b.konu] || b.konu), esc(b.mesaj), tarih(b.zaman)]; } }
];
function panelHtml(k){
  var n = k.kolon.length + 1;
  return '<section class="panel" id="' + k.id + '" aria-labelledby="' + k.id + '-b">' +
    '<header class="panel-bas"><h2 id="' + k.id + '-b">' + k.baslik + '</h2><span class="sayac" id="' + k.id + '-sayac"></span></header>' +
    '<div class="panel-ic"><div class="tablo-kap"><table class="tablo"><caption class="sr-only">' + k.baslik + '</caption>' +
    '<thead><tr>' + k.kolon.map(function(c){ return '<th scope="col">' + c + '</th>'; }).join('') + '<th scope="col">Durum</th></tr></thead>' +
    '<tbody id="' + k.id + '-tbody" data-n="' + n + '"></tbody></table></div></div></section>';
}
function kayitYenile(k){
  var tb = ana.querySelector('#' + k.id + '-tbody'), n = tb.dataset.n, T = UDV[k.tur];
  tb.innerHTML = '<tr><td colspan="' + n + '">Yükleniyor…</td></tr>';
  return Promise.resolve().then(function(){ return T.liste(); }).then(function(liste){
    ana.querySelector('#' + k.id + '-sayac').textContent = liste.length + ' ' + k.ad;
    if (!liste.length){ tb.innerHTML = '<tr><td colspan="' + n + '">' + k.bos + '</td></tr>'; return; }
    tb.innerHTML = liste.map(function(b){
      return '<tr>' + k.satir(b).map(function(h){ return '<td>' + h + '</td>'; }).join('') +
        '<td><select data-kayit="' + esc(b.id) + '"' + (b.fikir_id ? ' data-fikir="' + esc(b.fikir_id) + '"' : '') + ' aria-label="' + esc(k.etiket(b)) + ': durum">' +
          T.DURUMLAR.map(function(d){ return '<option value="' + d + '"' + (d === b.durum ? ' selected' : '') + '>' + T.DURUM_ADI[d] + '</option>'; }).join('') +
        '</select></td></tr>';
    }).join('');
  }).catch(function(err){
    tb.innerHTML = '<tr><td colspan="' + n + '">' + esc(err.message || 'Yüklenemedi.') + '</td></tr>';
  });
}

function $$chip(){
  ana.querySelectorAll('.chip').forEach(function(c){
    c.setAttribute('aria-pressed', String(c.dataset.durum === filtre.durum));
  });
}

function istatYenile(){
  var kap = ana.querySelector('#istatlar');
  return Promise.resolve().then(function(){ return UDV.ozet(); }).then(function(z){
    kap.innerHTML =
      '<div class="istat"><span>Vaka</span><b>' + sayi(z.vaka.toplam) + '</b><small>' + sayi(z.vaka.acik) + ' açık</small></div>' +
      '<div class="istat"><span>Fikir</span><b>' + sayi(z.fikir) + '</b></div>' +
      '<div class="istat"><span>Alıcı</span><b>' + sayi(z.alici) + '</b></div>';
  }).catch(function(err){
    kap.innerHTML = '';
    YON.toast(err.message || 'Özet yüklenemedi.', 'hata');
  });
}

function yenile(){
  var no = ++istek;
  var tb = ana.querySelector('#tbody');
  tb.innerHTML = '<tr><td colspan="7">Yükleniyor…</td></tr>';
  return Promise.resolve().then(function(){
    return UDV.vakalar.liste({ durum: filtre.durum || undefined, ara: filtre.ara || undefined });
  }).then(function(liste){
    return Promise.all(liste.map(function(v){
      return Promise.resolve(UDV.fikirler.vaka(v.id)).then(function(f){ return f.length; });
    })).then(function(sayilar){
      if (no !== istek) return;
      ana.querySelector('#sayac').textContent = liste.length + ' vaka';
      if (!liste.length){
        var bosMetin = filtre.durum || filtre.ara ? 'Bu filtrede vaka yok' : 'Henüz vaka yok';
        tb.innerHTML = '<tr><td class="bosluk" colspan="7"><div class="bos"><b>' + bosMetin + '</b>' +
          '<p>Filtreyi temizleyebilir ya da yeni bir vaka açabilirsin.</p>' +
          '<a class="btn sig sm" href="vaka/">Yeni vaka</a></div></td></tr>';
        return;
      }
      tb.innerHTML = liste.map(function(v, i){
        return '<tr>' +
          '<td><a href="vaka/?id=' + encodeURIComponent(v.id) + '">' + esc(v.baslik) + '</a></td>' +
          '<td>' + esc(v.firma || '—') + '</td>' +
          '<td>' + YON.durumRozeti(v.durum) + '</td>' +
          '<td class="sayi">' + sayi(v.adet) + '</td>' +
          '<td class="sayi">' + sayi(sayilar[i]) + '</td>' +
          '<td>' + tarih(v.acilis) + '</td>' +
          '<td>' + tarih(v.guncelleme) + '</td>' +
        '</tr>';
      }).join('');
    });
  }).catch(function(err){
    if (no !== istek) return;
    tb.innerHTML = '<tr><td colspan="7">Vakalar yüklenemedi.</td></tr>';
    YON.toast(err.message || 'Vakalar yüklenemedi.', 'hata');
  });
}

YON.guard(ciz);
})();
</script>
</body>
</html>
