<!doctype html>
<html lang="tr" data-root="../" data-page="yonetim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F3">
<title>Yönetim · Undustit</title>
<link rel="stylesheet" href="../assets/fonts/base.css">
<link rel="stylesheet" href="../assets/ud.css">
<link rel="stylesheet" href="../assets/bilesen.css">
<script src="../assets/stil.js"></script>
<style>
/* Yönetim özeti: yalnız bu sayfanın düzeni. Bileşenler bilesen.css'ten gelir. */
.y-ust{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.y-ust h1{font-size:clamp(30px,3.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0}
.panel + .panel,.bekleyen + .panel{margin-top:20px}
.bekleyen{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:16px;padding:14px 18px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--bg-2)}
.bekleyen b{font-weight:500;margin-right:6px}
.bekleyen span{color:var(--muted)}
.bekleyen a{text-decoration:none}
.durum-h{display:flex;align-items:center;gap:8px}
.durum-h select{min-width:0}
.y-ara{width:100%}
.y-ara.arama{flex:1 1 220px}
.y-durum{min-height:44px;padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--bg-2);font-size:15px}
.arac-cubugu .sol{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sayac{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablo td a{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.tablo td a:hover{text-decoration-color:var(--ink)}
.tablo td.bosluk{padding:0}
.tablo .bos{margin:0;border:0}
.bos-liste{margin:16px 0 0;color:var(--muted);font-size:14px}
.v-sure{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.v-sure.doldu{color:var(--err);font-weight:500}
.chip.uyari{border-color:var(--err);color:var(--err)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){.y-ust{align-items:stretch}.y-ust .btn{width:100%}}
</style>
</head>
<body class="yonetim">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="y-bas">
  <div class="y-kimlik" style="display:flex;align-items:center;gap:12px;min-width:0">
    <a class="link" href="../" style="font-weight:500;color:var(--ink);text-decoration:none">Undustit</a>
    <span style="color:var(--muted);font-size:14px">Yönetim</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
    <span data-y-kim style="font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw"></span>
    <button type="button" class="btn alt sm" data-y-cikis hidden>Çıkış</button>
  </div>
</header>
<div class="y-govde">
  <nav class="y-yan" aria-label="Yönetim menüsü" data-y-menu="ozet"></nav>
  <main id="main" class="y-ana" tabindex="-1"><p class="lead">Yükleniyor…</p></main>
</div>

<script src="../assets/ayar.js"></script>
<script src="../assets/ud/db.js"></script>
<script src="../assets/ud/temel.js"></script>
<script src="../assets/ud/depo.js"></script>
<script src="../assets/ud/arayuz.js"></script>
<script src="../assets/ud/hareket.js"></script>
<script src="../assets/veri.js"></script>
<script src="yonetim.js"></script>
<script>
(function(){
'use strict';
var YON = window.YONETIM;
var esc = YON.esc, sayi = YON.sayi, tarih = YON.tarih;
var filtre = { durum: '', ara: '' };
var istek = 0, aramaZamani = null;
var ana = null;

function $(s){ return ana.querySelector(s); }

function ciz(o, a){
  ana = a;
  var secenekler = [['', 'Bütün durumlar']].concat(UDV.DURUMLAR.map(function(d){ return [d, UDV.DURUM_ADI[d]]; })).map(function(p){
    return '<option value="' + esc(p[0]) + '"' + (filtre.durum === p[0] ? ' selected' : '') + '>' + esc(p[1]) + '</option>';
  }).join('');

  ana.innerHTML =
    '<div class="y-ust"><div><span class="eyebrow">Yönetim</span><h1>Özet</h1></div></div>' +
    '<div class="istatlar" id="istatlar" aria-live="polite"></div>' +
    '<div class="bekleyen" id="bekleyen" aria-live="polite"></div>' +
    '<section class="panel" id="vakalar" aria-labelledby="vk-b">' +
      '<header class="panel-bas"><h2 id="vk-b">Vakalar</h2><span class="sayac" id="sayac"></span></header>' +
      '<div class="panel-ic">' +
        '<div class="arac-cubugu">' +
          '<div class="sol">' +
            '<input class="y-ara" type="search" id="ara" placeholder="Başlık, firma, stok" aria-label="Vaka ara" value="' + esc(filtre.ara) + '">' +
            '<select id="durum-filtre" class="y-durum" aria-label="Duruma göre filtrele">' + secenekler + '</select>' +
          '</div>' +
          '<div class="sag"><a class="btn sig sm" href="vaka/">Yeni vaka</a></div>' +
        '</div>' +
        '<div class="tablo-kap"><table class="tablo kart-mobil">' +
          '<caption class="sr-only">Vakalar</caption>' +
          '<thead><tr><th scope="col">Başlık</th><th scope="col">Firma</th><th scope="col">Durum</th>' +
          '<th scope="col" class="sayi">Adet</th><th scope="col" class="sayi">Fikir</th>' +
          '<th scope="col">Açılış</th><th scope="col">Güncelleme</th></tr></thead>' +
          '<tbody id="tbody"></tbody>' +
        '</table></div>' +
      '</div>' +
    '</section>' +
    KAYITLAR.map(panelHtml).join('') +
    // the lists with nothing in them, in one quiet line instead of a panel each
    '<p class="bos-liste" id="bos-liste" hidden></p>';

  // A status is chosen first and written only with "Kaydet". The table is then read back from the database,
  // so what the row shows afterwards is what was really saved.
  KAYITLAR.forEach(function(k){
    var tb = ana.querySelector('#' + k.id + '-tbody');
    tb.addEventListener('change', function(e){
      var sec = e.target.closest('select[data-kayit]');
      if (!sec) return;
      sec.parentNode.querySelector('[data-kaydet]').disabled = sec.value === sec.dataset.ilk;
    });
    tb.addEventListener('click', function(e){
      var b = e.target.closest('[data-kaydet]');
      if (!b) return;
      var sec = b.parentNode.querySelector('select[data-kayit]');
      b.disabled = true; sec.disabled = true; b.textContent = 'Kaydediliyor…';
      Promise.resolve(k.degisince ? k.degisince(sec.dataset.kayit, sec.value, sec) : null)
        .then(function(){ return UDV[k.tur].durum(sec.dataset.kayit, sec.value); })
        .then(function(){ YON.toast(k.tamam, 'ok'); }, function(err){ YON.toast(err.message || 'Kaydedilemedi.', 'hata'); })
        .then(function(){ return kayitYenile(k); })
        .then(function(){ if (k.id === 'bildirimler') istatYenile(); });
    });
  });

  $('#durum-filtre').addEventListener('change', function(e){
    filtre.durum = e.target.value;
    yenile();
  });
  $('#ara').addEventListener('input', function(e){
    clearTimeout(aramaZamani);
    aramaZamani = setTimeout(function(){
      filtre.ara = e.target.value.trim();
      yenile();
    }, 200);
  });

  istatYenile();
  dolanYukle();
  yenile();
  KAYITLAR.forEach(kayitYenile);
}

// Sitenin yalnız yöneticiye gelen kayıtları: başvurular, mesajlar, bildirimler. Yeni olanlar üstte, durum satırdan değişir.
var KONU = { genel:'Genel', ortaklik:'İş birliği', basin:'Basın', yatirim:'Yatırım' };
var AMAC = { gormek:'Görmek', denemek:'Denemek', satin:'Satın almak' }, KIMIN = { bireysel:'Bireysel', firma:'Firma' };
var MODEL = { ortaklik:'Satış ortaklığı', odul:'Fikir ödülü', ikisi:'Ortaklık + ödül' };
var NEDEN = { spam:'Spam', uygunsuz:'Uygunsuz', kopya:'Kopya', yaniltici:'Yanıltıcı', diger:'Diğer' };
function posta(e){ return '<a class="link" href="mailto:' + encodeURIComponent(e).replace(/%40/g, '@') + '">' + esc(e) + '</a>'; }
var KAYITLAR = [
  { id:'bildirimler', tur:'bildirimler', baslik:'Bildirilen fikirler', ad:'bildirim', tamam:'Bildirim kaydedildi.',
    kolon:['Fikir','Sitede','Neden','Açıklama','Tarih'],
    etiket:function(b){ return (b.fikirler && b.fikirler.baslik) || 'Fikir'; },
    // "Sitede" is the idea's real state, read from the idea itself: the proof that hiding worked
    satir:function(b){
      var f = b.fikirler || {}, ad = esc(f.baslik || b.fikir_id);
      var anahtar = f.sahip ? f.sahip + ':' + b.fikir_id : (String(b.fikir_id).indexOf(':') > -1 ? b.fikir_id : '');
      return ['<b>' + (anahtar && f.gizli === false ? '<a href="../fikirler/?f=' + encodeURIComponent(anahtar) + '">' + ad + '</a>' : ad) + '</b>',
        f.gizli == null ? '—' : f.gizli ? '<span class="rozet kirmizi">Gizli</span>' : '<span class="rozet yesil">Yayında</span>',
        esc(NEDEN[b.neden] || b.neden), esc(b.aciklama || '—'), tarih(b.zaman)]; },
    // "Fikri gizle" fikri sitede gizler; başka bir karara dönmek onu yeniden yayına alır
    degisince:function(id, durum, sec){ var fid = sec.dataset.fikir; return fid ? UDV.fikirler.gizle(fid, durum === 'gizlendi') : null; } },
  // "Ürünü görmek istiyorum": a visitor wants to see, try or buy a case's stock itself
  { id:'numuneler', tur:'numuneler', baslik:'Ürün talepleri', ad:'talep', tamam:'Talep durumu kaydedildi.',
    kolon:['Kim','İstek','Vaka','Adet','İletişim','Not','Tarih'],
    etiket:function(b){ return b.ad; },
    satir:function(b){ return ['<b>' + esc(b.ad) + '</b><br><small>' + esc(KIMIN[b.tur] || b.tur) + (b.sehir ? ' · ' + esc(b.sehir) : '') + '</small>', esc(AMAC[b.amac] || b.amac),
      '<a href="vaka/?id=' + encodeURIComponent(b.vaka_id) + '">' + esc(b.vaka_id) + '</a>', esc(b.adet || '—'),
      posta(b.eposta) + (b.telefon ? '<br><small>' + esc(b.telefon) + '</small>' : ''), esc(b.notlar || '—'), tarih(b.zaman)]; } },
  { id:'basvurular', tur:'basvurular', baslik:'Vaka başvuruları', ad:'başvuru', tamam:'Başvuru durumu kaydedildi.',
    kolon:['Firma','Stok','Adet','Görsel','İletişim','Not','Vaka','Tarih'],
    etiket:function(b){ return b.firma; },
    satir:function(b){ return ['<b>' + esc(b.firma) + '</b>' + (b.kisi ? '<br><small>' + esc(b.kisi) + '</small>' : ''), (b.baslik ? '<b>' + esc(b.baslik) + '</b><br>' : '') + esc(b.stok) + [[b.olcu, b.sinif].filter(Boolean).join(' · '), b.taban_fiyat && 'taban: ' + b.taban_fiyat, MODEL[b.model], b.deneme_adedi && 'deneme: ' + b.deneme_adedi, b.odul && 'ödül: ' + b.odul].filter(Boolean).map(function(x){ return '<br><small>' + esc(x) + '</small>'; }).join(''),
      esc(b.adet || '—'), gorselHucre(b.gorsel),
      posta(b.eposta) + (b.telefon ? '<br><small>' + esc(b.telefon) + '</small>' : ''), esc(b.notlar || '—'),
      // one step from an application to its case: the form opens filled in, the company gets its panel access
      b.vaka_id ? '<a href="vaka/?id=' + encodeURIComponent(b.vaka_id) + '">Vakayı aç</a>' : '<a class="btn alt sm" href="vaka/?basvuru=' + encodeURIComponent(b.id) + '">Vaka oluştur</a>', tarih(b.zaman)]; } },
  { id:'mesajlar', tur:'mesajlar', baslik:'İletişim mesajları', ad:'mesaj', tamam:'Mesaj durumu kaydedildi.',
    kolon:['Kimden','Konu','Mesaj','Tarih'],
    etiket:function(b){ return b.eposta; },
    satir:function(b){ return [(b.ad ? '<b>' + esc(b.ad) + '</b><br>' : '') + posta(b.eposta), esc(KONU[b.konu] || b.konu), esc(b.mesaj), tarih(b.zaman)]; } }
];
// a company's photo: a small preview, opening the full image when it is a web address
function gorselHucre(u){
  var g = UD.gorselAdresi(u);
  if (!g) return '—';
  var img = '<img class="b-gorsel" src="' + esc(g) + '" alt="Başvuru görseli" loading="lazy">';
  return /^https:/.test(g) ? '<a href="' + esc(g) + '" target="_blank" rel="noopener">' + img + '</a>' : img;
}
function panelHtml(k){
  var n = k.kolon.length + 1;
  return '<section class="panel" id="' + k.id + '" aria-labelledby="' + k.id + '-b">' +
    '<header class="panel-bas"><h2 id="' + k.id + '-b">' + k.baslik + '</h2><span class="sayac" id="' + k.id + '-sayac"></span></header>' +
    '<div class="panel-ic"><div class="tablo-kap"><table class="tablo kart-mobil"><caption class="sr-only">' + k.baslik + '</caption>' +
    '<thead><tr>' + k.kolon.map(function(c){ return '<th scope="col">' + c + '</th>'; }).join('') + '<th scope="col">Durum</th></tr></thead>' +
    '<tbody id="' + k.id + '-tbody" data-n="' + n + '"></tbody></table></div></div></section>';
}
function kayitYenile(k){
  var tb = ana.querySelector('#' + k.id + '-tbody'), n = tb.dataset.n, T = UDV[k.tur];
  tb.innerHTML = '<tr><td colspan="' + n + '">Yükleniyor…</td></tr>';
  return Promise.resolve().then(function(){ return T.liste(); }).then(function(liste){
    // waiting = still in the first status (yeni / karar bekliyor)
    k.bekleyen = liste.filter(function(b){ return b.durum === T.DURUMLAR[0]; }).length;
    ana.querySelector('#' + k.id + '-sayac').textContent = liste.length + ' ' + k.ad + (k.bekleyen ? ' · ' + k.bekleyen + ' bekliyor' : '');
    bekleyenYaz();
    // an empty list takes no room: its panel hides and its name joins the quiet line under the others
    k.bosMu = !liste.length;
    tb.closest('.panel').hidden = k.bosMu;
    bosYaz();
    if (k.bosMu){ tb.innerHTML = ''; return; }
    tb.innerHTML = liste.map(function(b){
      return '<tr>' + k.satir(b).map(function(h, i){ return '<td' + (i ? ' data-etiket="' + esc(k.kolon[i]) + '"' : '') + '><div>' + h + '</div></td>'; }).join('') +
        '<td data-etiket="Durum"><div class="durum-h"><select data-kayit="' + esc(b.id) + '" data-ilk="' + esc(b.durum) + '"' + (b.fikir_id ? ' data-fikir="' + esc(b.fikir_id) + '"' : '') + ' aria-label="' + esc(k.etiket(b)) + ': durum">' +
          T.DURUMLAR.map(function(d){ return '<option value="' + d + '"' + (d === b.durum ? ' selected' : '') + '>' + T.DURUM_ADI[d] + '</option>'; }).join('') +
        '</select><button type="button" class="btn sig sm" data-kaydet disabled>Kaydet</button></div></td></tr>';
    }).join('');
  }).catch(function(err){
    tb.innerHTML = '<tr><td colspan="' + n + '">' + esc(err.message || 'Yüklenemedi.') + '</td></tr>';
  });
}

// open cases whose idea period is over: they wait for the admin (review, or more days)
var dolanlar = [];
function dolanYukle(){
  return Promise.resolve().then(function(){ return UDV.vakalar.liste({ durum:'acik' }); })
    .then(function(l){ dolanlar = l.filter(YON.sureDoldu); bekleyenYaz(); }, function(){});
}

function bosYaz(){
  var p = ana.querySelector('#bos-liste'), l = KAYITLAR.filter(function(k){ return k.bosMu; });
  p.hidden = !l.length;
  p.textContent = l.length ? 'Boş: ' + l.map(function(k){ return k.baslik.toLocaleLowerCase('tr'); }).join(', ') + '.' : '';
}

// what still needs a decision, as links to its table
function bekleyenYaz(){
  var kap = ana.querySelector('#bekleyen');
  if (!kap) return;
  var l = KAYITLAR.filter(function(k){ return k.bekleyen > 0; });
  var dolan = (dolanlar || []).map(function(v){ return '<a class="chip uyari" href="vaka/?id=' + encodeURIComponent(v.id) + '">“' + esc(v.baslik) + '” süresi doldu</a>'; });
  kap.innerHTML = '<b>Bekleyen işler</b>' + (l.length || dolan.length
    ? dolan.join('') + l.map(function(k){ return '<a class="chip" href="#' + k.id + '">' + k.bekleyen + ' ' + k.ad + '</a>'; }).join('')
    : '<span>Şu an bekleyen iş yok.</span>');
}

function istatYenile(){
  var kap = ana.querySelector('#istatlar');
  return Promise.resolve().then(function(){ return UDV.ozet(); }).then(function(z){
    kap.innerHTML =
      '<div class="istat"><span>Vaka</span><b>' + sayi(z.vaka.toplam) + '</b><small>' + sayi(z.vaka.acik) + ' açık</small></div>' +
      '<div class="istat"><span>Fikir</span><b>' + sayi(z.fikir) + '</b>' + (z.gizli ? '<small><a class="link" href="icerik/">' + sayi(z.gizli) + ' gizli</a></small>' : '') + '</div>' +
      '<div class="istat"><span>Alıcı</span><b>' + sayi(z.alici) + '</b></div>';
  }).catch(function(err){
    kap.innerHTML = '';
    YON.toast(err.message || 'Özet yüklenemedi.', 'hata');
  });
}

function yenile(){
  var no = ++istek;
  var tb = ana.querySelector('#tbody');
  tb.innerHTML = '<tr><td colspan="7">Yükleniyor…</td></tr>';
  return Promise.resolve().then(function(){
    return UDV.vakalar.liste({ durum: filtre.durum || undefined, ara: filtre.ara || undefined });
  }).then(function(liste){
    return Promise.all(liste.map(function(v){
      return Promise.resolve(UDV.fikirler.vaka(v.id)).then(function(f){ return f.length; });
    })).then(function(sayilar){
      if (no !== istek) return;
      ana.querySelector('#sayac').textContent = liste.length + ' vaka';
      if (!liste.length){
        var bosMetin = filtre.durum || filtre.ara ? 'Bu filtrede vaka yok' : 'Henüz vaka yok';
        tb.innerHTML = '<tr><td class="bosluk" colspan="7"><div class="bos"><b>' + bosMetin + '</b>' +
          '<p>Filtreyi temizleyebilir ya da yeni bir vaka açabilirsin.</p>' +
          '<a class="btn sig sm" href="vaka/">Yeni vaka</a></div></td></tr>';
        return;
      }
      tb.innerHTML = liste.map(function(v, i){
        return '<tr>' +
          '<td><a href="vaka/?id=' + encodeURIComponent(v.id) + '">' + esc(v.baslik) + '</a></td>' +
          '<td data-etiket="Firma">' + '<div>' + esc(v.firma || '—') + '</div>' + '</td>' +
          '<td data-etiket="Durum">' + '<div>' + YON.durumRozeti(v.durum) + (YON.sureMetni(v) ? '<small class="v-sure' + (YON.sureDoldu(v) ? ' doldu' : '') + '">' + esc(YON.sureMetni(v)) + '</small>' : '') + '</div>' + '</td>' +
          '<td class="sayi" data-etiket="Adet">' + '<div>' + sayi(v.adet) + '</div>' + '</td>' +
          '<td class="sayi" data-etiket="Fikir">' + '<div>' + sayi(sayilar[i]) + '</div>' + '</td>' +
          '<td data-etiket="Açılış">' + '<div>' + tarih(v.acilis) + '</div>' + '</td>' +
          '<td data-etiket="Güncelleme">' + '<div>' + tarih(v.guncelleme) + '</div>' + '</td>' +
        '</tr>';
      }).join('');
    });
  }).catch(function(err){
    if (no !== istek) return;
    tb.innerHTML = '<tr><td colspan="7">Vakalar yüklenemedi.</td></tr>';
    YON.toast(err.message || 'Vakalar yüklenemedi.', 'hata');
  });
}

YON.guard(ciz);
})();
</script>
</body>
</html>
