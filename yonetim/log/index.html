<!doctype html>
<html lang="tr" data-root="../../" data-page="yonetim">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F3">
<title>Log · Yönetim · Undustit</title>
<link rel="stylesheet" href="../../assets/fonts/base.css">
<link rel="stylesheet" href="../../assets/ud.css">
<link rel="stylesheet" href="../../assets/bilesen.css">
<script src="../../assets/stil.js"></script>
<style>
/* Log: sitenin tarayıcıda yakaladığı hatalar (supabase/10-hata.sql, error_logs). Bileşenler bilesen.css'ten gelir. */
.y-ust{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.y-ust h1{font-size:clamp(30px,3.4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:8px 0 0}
.y-ust p{margin:6px 0 0;color:var(--ink-2);font-size:14px;max-width:64ch}
.sayac{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.log-arac{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.log-arac label{display:flex;align-items:center;gap:8px;font-size:14px}
.durum-h{display:flex;align-items:center;gap:8px}
.tablo td code{font-size:12.5px;word-break:break-all}
.tablo tr.cozuldu td{color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body class="yonetim">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="y-bas">
  <div class="y-kimlik" style="display:flex;align-items:center;gap:12px;min-width:0">
    <a class="link" href="../../" style="font-weight:500;color:var(--ink);text-decoration:none">Undustit</a>
    <span style="color:var(--muted);font-size:14px">Yönetim</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
    <span data-y-kim style="font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw"></span>
    <button type="button" class="btn alt sm" data-y-cikis hidden>Çıkış</button>
  </div>
</header>
<div class="y-govde">
  <nav class="y-yan" aria-label="Yönetim menüsü" data-y-menu="log"></nav>
  <main id="main" class="y-ana" tabindex="-1"><p class="lead">Yükleniyor…</p></main>
</div>

<script src="../../assets/ayar.js"></script>
<script src="../../assets/ud/db.js"></script>
<script src="../../assets/ud/temel.js"></script>
<script src="../../assets/ud/depo.js"></script>
<script src="../../assets/ud/arayuz.js"></script>
<script src="../../assets/ud/hareket.js"></script>
<script src="../../assets/veri.js"></script>
<script src="../yonetim.js"></script>
<script>
(function(){
'use strict';
var YON = window.YONETIM;
var esc = YON.esc, tarihSaat = YON.tarihSaat;
var ana = null, liste = [], hepsi = false;
var H = function(){ return UDV.hatalar; };

// "Chrome 130 · Android" instead of the whole user-agent string
function tarayiciAdi(ua){
  ua = String(ua || '');
  var t = (ua.match(/(Edg|OPR|Firefox|CriOS|Chrome|Version)\/(\d+)/) || [])[0] || '';
  t = t.replace('Edg', 'Edge').replace('OPR', 'Opera').replace('CriOS', 'Chrome').replace('Version', 'Safari').replace('/', ' ');
  var s = /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  return [t, s].filter(Boolean).join(' · ') || '—';
}

function ciz(o, a){
  ana = a;
  ana.innerHTML =
    '<div class="y-ust"><div><span class="eyebrow">Yönetim</span><h1>Log</h1>' +
      '<p>Ziyaretçilerin tarayıcısında yakalanan site hataları. Her mesaj sayfa başına bir kez gelir; arama motoru botları ve ' +
      'zararsız sayfa geçişi kesintileri kaydedilmez. Düzeltilen ya da önemsiz olanı “Çözüldü” yap.</p></div></div>' +
    '<section class="panel" aria-labelledby="l-b"><header class="panel-bas"><h2 id="l-b">Site hataları</h2><span class="sayac" id="sayac"></span></header>' +
      '<div class="panel-ic"><div class="log-arac">' +
        '<label><input type="checkbox" id="hepsi"> Çözülenleri de göster</label>' +
        '<button type="button" class="btn alt sm" id="hepsini-coz" hidden>Hepsini çözüldü yap</button></div>' +
        '<div class="tablo-kap"><table class="tablo"><caption class="sr-only">Site hataları</caption>' +
        '<thead><tr><th scope="col">Hata</th><th scope="col">Sayfa</th><th scope="col">Kaynak</th><th scope="col">Tarayıcı</th><th scope="col">Tarih</th><th scope="col">Durum</th></tr></thead>' +
        '<tbody id="tbody"></tbody></table></div></div></section>';
  ana.querySelector('#hepsi').addEventListener('change', function(e){ hepsi = e.target.checked; yaz(); });
  ana.querySelector('#hepsini-coz').addEventListener('click', hepsiniCoz);
  var tb = ana.querySelector('#tbody');
  tb.addEventListener('change', function(e){
    var s = e.target.closest('select[data-kayit]');
    if (s) s.parentNode.querySelector('[data-kaydet]').disabled = s.value === s.dataset.ilk;
  });
  tb.addEventListener('click', function(e){
    var b = e.target.closest('[data-kaydet]');
    if (!b) return;
    var s = b.parentNode.querySelector('select[data-kayit]');
    b.disabled = true; s.disabled = true; b.textContent = 'Kaydediliyor…';
    Promise.resolve().then(function(){ return H().durum(s.dataset.kayit, s.value); })
      .then(function(){ YON.toast('Hata durumu kaydedildi.', 'ok'); }, function(err){ YON.toast(err.message || 'Kaydedilemedi.', 'hata'); })
      .then(yukle);
  });
  yukle();
}

function yukle(){
  return Promise.resolve().then(function(){ return H().liste(); }).then(function(l){
    liste = l; yaz();
    document.dispatchEvent(new Event('y-log-degisti'));
  }).catch(function(err){ ana.querySelector('#tbody').innerHTML = '<tr><td colspan="6">' + esc(err.message || 'Yüklenemedi.') + '</td></tr>'; });
}

function yaz(){
  var yeni = H().DURUMLAR[0];
  var bekleyen = liste.filter(function(b){ return b.durum === yeni; });
  var gorunen = hepsi ? liste : bekleyen;
  ana.querySelector('#sayac').textContent = bekleyen.length + ' yeni' + (liste.length > bekleyen.length ? ' · ' + (liste.length - bekleyen.length) + ' çözüldü' : '');
  ana.querySelector('#hepsini-coz').hidden = !bekleyen.length;
  var tb = ana.querySelector('#tbody');
  tb.innerHTML = gorunen.length ? gorunen.map(function(b){
    return '<tr' + (b.durum !== yeni ? ' class="cozuldu"' : '') + '><td>' + esc(b.mesaj) + '</td><td><code>' + esc(b.sayfa || '/') + '</code></td>' +
      '<td><small>' + esc((b.kaynak || '—') + (b.satir ? ':' + b.satir : '')) + '</small></td><td><small>' + esc(tarayiciAdi(b.tarayici)) + '</small></td>' +
      '<td>' + esc(tarihSaat(b.zaman)) + '</td>' +
      '<td><div class="durum-h"><select data-kayit="' + esc(b.id) + '" data-ilk="' + esc(b.durum) + '" aria-label="Hata durumu">' +
        H().DURUMLAR.map(function(d){ return '<option value="' + d + '"' + (d === b.durum ? ' selected' : '') + '>' + H().DURUM_ADI[d] + '</option>'; }).join('') +
      '</select><button type="button" class="btn sig sm" data-kaydet disabled>Kaydet</button></div></td></tr>';
  }).join('') : '<tr><td colspan="6">' + (liste.length ? 'Yeni hata yok. Çözülenler için yukarıdaki kutuyu işaretle.' : 'Kayıtlı hata yok.') + '</td></tr>';
  YON.kartla(tb.closest('table'));
}

function hepsiniCoz(){
  var yeni = H().DURUMLAR[0], cozuldu = H().DURUMLAR[1];
  var l = liste.filter(function(b){ return b.durum === yeni; });
  YON.onay({ baslik: l.length + ' hata çözüldü olarak işaretlensin mi?', metin: 'Kayıtlar silinmez; “Çözülenleri de göster” ile görünür.', eylem: 'Hepsini çözüldü yap' })
    .then(function(r){
      if (!r) return;
      return Promise.all(l.map(function(b){ return H().durum(b.id, cozuldu); }))
        .then(function(){ YON.toast(l.length + ' hata çözüldü.', 'ok'); });
    }).catch(function(err){ YON.toast(err.message || 'Kaydedilemedi.', 'hata'); }).then(yukle);
}

YON.guard(ciz);
})();
</script>
</body>
</html>
