<!doctype html>
<html lang="tr" data-root="../../" data-page="yonetim-vaka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FCF9F3">
<title>Vaka · Yönetim · Undustit</title>
<link rel="stylesheet" href="../../assets/fonts/base.css">
<link rel="stylesheet" href="../../assets/ud.css">
<link rel="stylesheet" href="../../assets/bilesen.css">
<script src="../../assets/stil.js"></script>
<style>
/* Vaka yönetimi: yalnız bu sayfanın düzeni. Bileşenler bilesen.css'ten gelir. */
.y-ust{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.y-ust-metin{min-width:0;display:grid;gap:6px;justify-items:start}
.y-ust h1{font-size:clamp(28px,3.2vw,40px);line-height:1.08;letter-spacing:-.02em;margin:4px 0 0;overflow-wrap:anywhere}
.y-eylemler,.y-eylem{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.y-eylem{margin-top:20px}
.kagit{margin-bottom:16px}
.kagit summary{cursor:pointer;width:max-content;list-style:none}
.kagit summary::-webkit-details-marker{display:none}
.kagit[open] summary{margin-bottom:14px}
.kagit-form{display:grid;gap:12px;padding:16px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--bg-3)}
.kagit-form .not{margin:0;color:var(--ink-2);font-size:14px}
.kagit-sayac{color:var(--muted);font-size:14px}
.kagit-rozet{font-size:10.5px}
.kagit-iletisim{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.v-sure{margin-left:8px;font-size:13.5px;color:var(--ink-2)}
.v-sure.doldu{color:var(--err);font-weight:500}
.gorunur{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
/* the save bar sticks to the screen's bottom: its panel must not clip (overflow:hidden stops sticky) */
#p-bilgiler{overflow:visible}
.y-eylemler .y-sil{color:var(--err);border-color:var(--err)}
.y-eylemler [disabled]{opacity:.5;cursor:not-allowed}
.y-alanlar{display:grid;gap:16px}
.sekmeler{margin-bottom:20px}
[role="tabpanel"]{margin:0}
[role="tabpanel"][hidden]{display:none}
.panel-ic .y-disa{display:grid;gap:16px;justify-items:start}
.tablo td a{color:var(--ink)}
.tablo .anahtar{min-height:36px}
.y-firma{display:grid;gap:16px}
.y-firma-ekle{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.y-firma-ekle .alan{flex:1 1 260px;margin:0}
.y-firmalar{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-2)}
.y-firmalar li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;overflow-wrap:anywhere}
.y-firmalar li + li{border-top:1px solid var(--line)}
.y-firmalar .bos-satir{color:var(--muted)}
.y-firmalar .y-davet{color:var(--muted)}
.y-firma-eylem{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (max-width:640px){.y-ust{align-items:stretch}.y-eylemler .btn{flex:1 1 auto}}
</style>
</head>
<body class="yonetim">
<a class="skip" href="#main">İçeriğe geç</a>
<header class="y-bas">
  <div class="y-kimlik" style="display:flex;align-items:center;gap:12px;min-width:0">
    <a class="link" href="../../" style="font-weight:500;color:var(--ink);text-decoration:none">Undustit</a>
    <span style="color:var(--muted);font-size:14px">Yönetim</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;min-width:0">
    <span data-y-kim style="font-size:14px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44vw"></span>
    <button type="button" class="btn alt sm" data-y-cikis hidden>Çıkış</button>
  </div>
</header>
<div class="y-govde">
  <nav class="y-yan" aria-label="Yönetim menüsü" data-y-menu="vakalar"></nav>
  <main id="main" class="y-ana" tabindex="-1"><p class="lead">Yükleniyor…</p></main>
</div>

<script src="../../assets/ayar.js"></script>
<script src="../../assets/ud/db.js"></script>
<script src="../../assets/ud/temel.js"></script>
<script src="../../assets/ud/depo.js"></script>
<script src="../../assets/ud/arayuz.js"></script>
<script src="../../assets/ud/hareket.js"></script>
<script src="../../assets/veri.js"></script>
<script src="../yonetim.js"></script>
<script>
(function(){
'use strict';
var YON = window.YONETIM;
var esc = YON.esc, sayi = YON.sayi, tutar = YON.tutar;
var params = new URLSearchParams(location.search);
var id = (params.get('id') || '').trim();
var basvuruId = (params.get('basvuru') || '').trim();   // yeni vaka bir başvurudan açılıyorsa
var enc = encodeURIComponent;
var GECIS_ETIKET = { acik:'Açık yap', degerlendirme:'Değerlendirmeye al', kazanan:'Kazananı onayla', uretim:'Üretime al', kapali:'Kapat' };
var ana = null;
var vaka = null;
var aktifSekme = 'bilgiler';
var fikirListesi = [];

function $(s){ return ana.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(ana.querySelectorAll(s)); }
function hata(err, varsayilan){ YON.toast((err && err.message) || varsayilan, 'hata'); }

function navIsaretle(yeni){
  document.querySelectorAll('.y-yan [data-nav]').forEach(function(a){
    var on = a.dataset.nav === (yeni ? 'yeni' : 'vakalar');
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

function ciz(o, a){
  ana = a;
  navIsaretle(!id);
  if (!id) return yeniFormCiz();
  kabukCiz();
}

// ----------------------------------------------------------- yeni vaka
function yeniFormCiz(){
  document.title = 'Yeni vaka · Yönetim · Undustit';
  ana.innerHTML =
    '<div class="y-ust"><div class="y-ust-metin"><a class="link" href="../">← Vakalar</a>' +
      '<h1>Yeni vaka</h1></div></div>' +
    '<section class="panel" aria-labelledby="yn-b"><header class="panel-bas"><h2 id="yn-b">Vaka bilgileri</h2>' +
      '<span class="sayac">Taslak olarak açılır</span></header>' +
    '<div class="panel-ic"><p class="lead" id="bv-not" hidden></p><form id="vaka-form" novalidate>' +
      '<div class="y-alanlar" id="alanlar"></div>' +
      '<div class="y-eylem"><button class="btn sig" type="submit">Vakayı oluştur</button>' +
      '<a class="btn alt" href="../">Vazgeç</a></div>' +
    '</form></div></section>';
  var form = $('#vaka-form');
  YON.formCiz($('#alanlar'), null);
  // from an application: its answers fill the form, and creating the case gives the company its panel access
  var basvuru = null;
  var sayiCek = function(s){ var m = String(s || '').replace(/\./g, '').replace(',', '.').match(/\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
  if (basvuruId) Promise.resolve().then(function(){ return UDV.basvurular.liste(); }).then(function(l){
    basvuru = l.find(function(b){ return b.id === basvuruId; }) || null;
    if (!basvuru) return;
    var adet = sayiCek(basvuru.adet);
    var deneme = sayiCek(basvuru.deneme_adedi);
    YON.formCiz($('#alanlar'), { sure_gun:30, baslik:basvuru.baslik || '', ozet:basvuru.ozet || '', aciklama:basvuru.notlar || '',
      firma:basvuru.firma, stok:basvuru.stok, adet: adet ? Math.round(adet) : null, olcu:basvuru.olcu || '', sinif:basvuru.sinif || '',
      taban_fiyat:sayiCek(basvuru.taban_fiyat), deneme_adedi: deneme ? Math.round(deneme) : null, odul:sayiCek(basvuru.odul),
      gorsel:basvuru.gorsel || '', ortaklik: basvuru.model !== 'odul' });
    var n = $('#bv-not'); n.hidden = false;
    n.textContent = basvuru.firma + ' başvurusundan dolduruldu. Firmanın yazdıklarını ve sayıları kontrol edin; boş kalanı siz yazın. Oluşturunca ' + basvuru.eposta +
      ' firma paneline eklenir, başvuru “Kabul” olur ve bu adrese kullanıcı adı ile şifre belirleme bağlantısı e-postayla gider.';
    form.querySelector('[name="baslik"]').focus();
  }).catch(function(err){ hata(err, 'Başvuru okunamadı.'); });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var v = YON.formOku(form), h = YON.formDogrula(v);
    if (Object.keys(h).length) return YON.formHatalari(form, h);
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    Promise.resolve().then(function(){ return UDV.vakalar.olustur(v); }).then(function(yeni){
      if (!basvuru) return { yeni:yeni };
      return UDV.firma.ekle(yeni.id, basvuru.eposta).then(function(){ return UDV.basvurular.bagla(basvuru.id, yeni.id); })
        .then(function(){
          // accepted: the company gets its username and a set-your-password link (never a password)
          return UDV.firma.davet(yeni.id, basvuru.eposta).then(function(d){ return { yeni:yeni, firma:basvuru.eposta, davet:d }; },
            function(err){ return { yeni:yeni, firma:basvuru.eposta, davetSorun:(err && err.message) || 'bilinmeyen hata' }; });
        }, function(err){ return { yeni:yeni, sorun:(err && err.message) || 'bilinmeyen hata' }; });
    }).then(function(s){
      var yeni = s.yeni;
      YON.sonrakiBildirim('“' + yeni.baslik + '” taslak olarak açıldı.' + (s.firma ? ' ' + s.firma + ' firma paneline eklendi.' : '') +
        (s.davet ? (s.davet.yerel ? ' Yerel önizlemede e-posta gönderilmez.' : ' Giriş bilgileri e-postayla gönderildi.') : '') +
        (s.davetSorun ? ' Giriş bilgileri gönderilemedi: ' + s.davetSorun + '. Firma erişimi sekmesinden tekrar deneyin.' : '') +
        (s.sorun ? ' Firma erişimi eklenemedi: ' + s.sorun : ''), (s.sorun || s.davetSorun) ? 'hata' : 'ok');
      location.href = '?id=' + enc(yeni.id);
    }).catch(function(err){
      btn.disabled = false;
      hata(err, 'Vaka oluşturulamadı.');
    });
  });
}

// ----------------------------------------------------------- vaka kabuğu
function kabukCiz(){
  document.title = 'Vaka · Yönetim · Undustit';
  ana.innerHTML =
    '<div class="y-ust"><div class="y-ust-metin"><a class="link" href="../">← Vakalar</a>' +
      '<h1 id="v-baslik">Yükleniyor…</h1><div id="v-durum"></div></div>' +
      '<div class="y-eylemler" id="v-eylem"></div></div>' +
    '<div class="sekmeler" role="tablist" aria-label="Vaka bölümleri">' +
      '<button type="button" role="tab" class="sekme" id="t-bilgiler" data-sekme="bilgiler" aria-selected="true" aria-controls="p-bilgiler">Bilgiler</button>' +
      '<button type="button" role="tab" class="sekme" id="t-fikirler" data-sekme="fikirler" aria-selected="false" aria-controls="p-fikirler" tabindex="-1">Fikirler</button>' +
      '<button type="button" role="tab" class="sekme" id="t-gecmis" data-sekme="gecmis" aria-selected="false" aria-controls="p-gecmis" tabindex="-1">Geçmiş</button>' +
      '<button type="button" role="tab" class="sekme" id="t-firma" data-sekme="firma" aria-selected="false" aria-controls="p-firma" tabindex="-1">Firma erişimi</button>' +
      '<button type="button" role="tab" class="sekme" id="t-disa" data-sekme="disa" aria-selected="false" aria-controls="p-disa" tabindex="-1">Dışa aktar</button>' +
    '</div>' +
    '<section class="panel" role="tabpanel" id="p-bilgiler" data-sekme="bilgiler" aria-labelledby="t-bilgiler">' +
      '<div class="panel-ic"><form id="vaka-form" novalidate>' +
        '<div class="y-alanlar" id="alanlar"></div>' +
        '<div class="y-eylem kayit-cubugu"><button class="btn sig" type="submit">Kaydet</button>' +
          '<span class="kayit-durum" id="kayit-durum" aria-live="polite">Değişiklik yok</span></div>' +
      '</form></div></section>' +
    '<section class="panel" role="tabpanel" id="p-fikirler" data-sekme="fikirler" aria-labelledby="t-fikirler" hidden>' +
      '<div class="panel-ic"><div id="kagit-kap"></div><div id="fikirler"><p class="lead">Yükleniyor…</p></div></div></section>' +
    '<section class="panel" role="tabpanel" id="p-gecmis" data-sekme="gecmis" aria-labelledby="t-gecmis" hidden>' +
      '<div class="panel-ic" id="gecmis"><p class="lead">Yükleniyor…</p></div></section>' +
    '<section class="panel" role="tabpanel" id="p-firma" data-sekme="firma" aria-labelledby="t-firma" hidden>' +
      '<div class="panel-ic y-firma"><p class="lead">Buraya eklenen e-postayla giren firma, <a class="link" href="../../firma/">firma panelinde</a> bu vakanın fikirlerini, ' +
        'taleplerini ve fiyat dağılımını görür, ürün fotoğrafını ve 3D modelini yükleyebilir. Başka hiçbir şeyi değiştiremez.</p>' +
        '<form id="firma-form" class="y-firma-ekle" novalidate><label class="alan"><span>Firma e-postası</span>' +
          '<input type="email" name="eposta" autocomplete="off" placeholder="satis@firma.com.tr" required></label>' +
          '<button class="btn sig" type="submit">Ekle</button></form>' +
        '<ul class="y-firmalar" id="firmalar" aria-live="polite"></ul></div></section>' +
    '<section class="panel" role="tabpanel" id="p-disa" data-sekme="disa" aria-labelledby="t-disa" hidden>' +
      '<div class="panel-ic y-disa"><p class="lead">Fikirler bir CSV dosyası olarak indirilir. Dosya Excel’de Türkçe karakterlerle açılır.</p>' +
      '<button class="btn sig" type="button" data-csv>CSV indir</button></div></section>';

  var tl = $('.sekmeler');
  tl.addEventListener('click', function(e){
    var t = e.target.closest('[role="tab"]');
    if (t) sekmeSec(t.dataset.sekme, true);
  });
  tl.addEventListener('keydown', function(e){
    var tablar = $$('[role="tab"]');
    var i = tablar.indexOf(document.activeElement);
    if (i < 0) return;
    var j = null;
    if (e.key === 'ArrowRight') j = (i + 1) % tablar.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tablar.length) % tablar.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tablar.length - 1;
    if (j === null) return;
    e.preventDefault();
    sekmeSec(tablar[j].dataset.sekme, true);
  });

  $('#vaka-form').addEventListener('submit', kaydet);
  // any edit lights the save bar; leaving the page with one unsaved asks first
  ['input', 'change'].forEach(function(t){ $('#vaka-form').addEventListener(t, function(){ kayitDurumu(true); }); });
  window.addEventListener('beforeunload', function(e){
    var d = $('#kayit-durum');
    if (d && d.classList.contains('degisti')){ e.preventDefault(); e.returnValue = ''; }
  });
  $('#v-eylem').addEventListener('click', eylemTikla);
  $('#fikirler').addEventListener('click', gizleTikla);
  $('#fikirler').addEventListener('click', kazananTikla);
  $('[data-csv]').addEventListener('click', csvIndir);
  $('#firma-form').addEventListener('submit', firmaEkle);
  $('#firmalar').addEventListener('click', firmaSil);

  yukle(true);
}

function sekmeSec(ad, odakla){
  aktifSekme = ad;
  $$('[role="tab"]').forEach(function(t){
    var on = t.dataset.sekme === ad;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
    if (on && odakla) t.focus();
  });
  $$('[role="tabpanel"]').forEach(function(p){ p.hidden = p.dataset.sekme !== ad; });
  sekmeYukle(ad);
}

function sekmeYukle(ad){
  if (!vaka) return;
  if (ad === 'fikirler') return fikirleriYaz();
  if (ad === 'gecmis') return gecmisYaz();
  if (ad === 'firma') return firmalariYaz();
}

// ----------------------------------------------------------- firma erişimi
function firmalariYaz(){
  var kap = $('#firmalar');
  return Promise.resolve().then(function(){
    return Promise.all([UDV.firma.liste(vaka.id), UDV.firma.davetler(vaka.id).catch(function(){ return {}; })]);
  }).then(function(r){
    var l = r[0], dv = r[1];
    kap.innerHTML = l.length ? l.map(function(e){
      // the visible state: when the sign-in e-mail last went out, and the verb that sends it (again)
      return '<li><span>' + esc(e) + '<br><small class="y-davet">' + (dv[e] ? 'Giriş bilgisi gönderildi: ' + esc(YON.tarihSaat(dv[e])) : 'Giriş bilgisi gönderilmedi') + '</small></span>' +
        '<span class="y-firma-eylem"><button type="button" class="btn alt sm" data-firma-davet="' + esc(e) + '">' + (dv[e] ? 'Tekrar gönder' : 'Giriş bilgisi gönder') + '</button>' +
        '<button type="button" class="btn alt sm" data-firma-sil="' + esc(e) + '">Kaldır</button></span></li>';
    }).join('') : '<li class="bos-satir">Henüz firma eklenmedi.</li>';
  }).catch(function(err){ kap.innerHTML = ''; hata(err, 'Firma listesi yüklenemedi.'); });
}
function firmaEkle(e){
  e.preventDefault();
  var f = e.target, btn = f.querySelector('[type=submit]');
  btn.disabled = true;
  UDV.firma.ekle(vaka.id, f.eposta.value).then(function(){
    f.reset(); YON.toast('Firma eklendi. Bu e-postayla firma panelinden girebilir.', 'ok');
    return firmalariYaz();
  }).catch(function(err){ hata(err, 'Firma eklenemedi.'); f.eposta.focus(); })
    .then(function(){ btn.disabled = false; });
}
function firmaDavet(b){
  var eposta = b.dataset.firmaDavet;
  YON.onay({ baslik:'Giriş bilgisi gönderilsin mi?', metin:eposta + ' adresine kullanıcı adı ve tek kullanımlık şifre belirleme bağlantısı gider. Şifre e-postaya yazılmaz.', eylem:'Gönder' }).then(function(evet){
    if (!evet) return;
    b.disabled = true;
    return UDV.firma.davet(vaka.id, eposta).then(function(d){
      YON.toast(d && d.yerel ? 'Yerel önizlemede e-posta gönderilmez; zaman kaydedildi.' : 'Giriş bilgileri ' + eposta + ' adresine gönderildi.', 'ok');
      return firmalariYaz();
    });
  }).catch(function(err){ b.disabled = false; hata(err, 'Gönderilemedi.'); });
}
function firmaSil(e){
  var d = e.target.closest('[data-firma-davet]');
  if (d) return firmaDavet(d);
  var b = e.target.closest('[data-firma-sil]');
  if (!b) return;
  var eposta = b.dataset.firmaSil;
  YON.onay({ baslik:'Firma erişimi kaldırılsın mı?', metin:eposta + ' artık bu vakayı firma panelinde göremez.', eylem:'Kaldır', tehlike:true }).then(function(evet){
    if (!evet) return;
    return UDV.firma.sil(vaka.id, eposta).then(function(){ YON.toast('Firma erişimi kaldırıldı.', 'ok'); return firmalariYaz(); });
  }).catch(function(err){ hata(err, 'Kaldırılamadı.'); });
}

function bulunamadi(){
  document.title = 'Vaka bulunamadı · Yönetim · Undustit';
  ana.innerHTML =
    '<div class="y-ust"><div class="y-ust-metin"><a class="link" href="../">← Vakalar</a><h1>Vaka bulunamadı</h1></div></div>' +
    '<div class="bos"><b>“' + esc(id) + '” kimliğiyle vaka yok</b>' +
    '<p>Bağlantı yanlış olabilir ya da vaka silinmiş olabilir.</p>' +
    '<a class="btn sig sm" href="../">Vakalara dön</a></div>';
}

// vaka verisini okur; ilk yüklemede formu kurar, sonrakilerde yalnız üst bilgiyi yeniler
function yukle(ilk){
  return Promise.resolve().then(function(){ return UDV.vakalar.al(id); }).then(function(v){
    if (!v){ vaka = null; return bulunamadi(); }
    vaka = v;
    if (ilk) YON.formCiz($('#alanlar'), v);
    ustYaz();
    sekmeYukle(aktifSekme);
  }).catch(function(err){
    if (!vaka) return bulunamadi();
    hata(err, 'Vaka yüklenemedi.');
  });
}

function ustYaz(){
  document.title = vaka.baslik + ' · Yönetim · Undustit';
  $('#v-baslik').textContent = vaka.baslik;
  var sm = YON.sureMetni(vaka);
  $('#v-durum').innerHTML = YON.durumRozeti(vaka.durum) + (sm ? ' <span class="v-sure' + (YON.sureDoldu(vaka) ? ' doldu' : '') + '">' + esc(sm) +
    (YON.sureDoldu(vaka) ? ': vaka yeni fikir almıyor. Değerlendirmeye al ya da Bilgiler’den fikir süresini uzat.' : '') + '</span>' : '');
  var gecisler = (UDV.GECIS[vaka.durum] || []).map(function(d){
    var kapali = d === 'kapali';
    var pasif = d === 'kazanan' && !vaka.kazanan;
    return '<button type="button" class="btn ' + (kapali ? 'alt' : 'sig') + ' sm" data-gecis="' + esc(d) + '"' +
      (pasif ? ' disabled title="Önce Fikirler sekmesinden kazanan seç"' : '') + '>' +
      esc(GECIS_ETIKET[d] || UDV.DURUM_ADI[d]) + '</button>';
  }).join('');
  var sil = vaka.durum === 'taslak' ? '<button type="button" class="btn alt sm y-sil" data-sil>Sil</button>' : '';
  $('#v-eylem').innerHTML = gecisler +
    '<a class="btn alt sm" href="../../vaka/?id=' + enc(vaka.id) + '">Sitede gör</a>' + sil;
}

function eylemTikla(e){
  var b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.gecis) return gecis(b.dataset.gecis);
  if (b.hasAttribute('data-sil')) return sil();
}

// before a draft goes out: what a visitor or the company would miss (it can still go out)
function yayinEksikleri(){
  var l = [];
  if (!vaka.gorsel && !vaka.model3d) l.push('Ürün fotoğrafı yok: vaka sayfasında görsel olmaz.');
  if (!String(vaka.ozet || '').trim()) l.push('Kısa açıklama yok: kartlarda ve sayfa başında boş görünür.');
  if (vaka.ortaklik !== false && !(Number(vaka.deneme_adedi) > 0)) l.push('Deneme partisi adedi yok: ziyaretçi kaç adet üretileceğini göremez.');
  return Promise.resolve().then(function(){ return UDV.firma.liste(vaka.id); }).then(function(f){
    if (!f.length) l.push('Firma erişimi yok: firma kendi panelinden talepleri göremez.');
    return l;
  }, function(){ return l; });
}

function gecis(d){
  var ad = UDV.DURUM_ADI[d];
  var ilkYayin = d === 'acik' && vaka.durum === 'taslak';
  var tekrar = d === 'acik' && vaka.durum !== 'taslak';
  var sureNotu = ilkYayin ? ' Fikir süresi (' + (vaka.sure_gun || 30) + ' gün) şimdi başlar.' :
    tekrar ? ' Fikir süresi baştan başlamaz: ' + (YON.sureMetni(Object.assign({}, vaka, { durum:'acik' })) || '—') + '. Gerekirse Bilgiler’den süreyi uzat.' : '';
  return (ilkYayin ? yayinEksikleri() : Promise.resolve([])).then(function(eksik){ return YON.onay({
    baslik: GECIS_ETIKET[d] + '?',
    metin: '“' + vaka.baslik + '” “' + ad + '” durumuna geçecek.' + sureNotu + (eksik.length ? ' Eksikler (yine de yayına alabilirsin):' : ''),
    liste: eksik,
    eylem: GECIS_ETIKET[d],
    notAlani: true,
    notEtiketi: 'Not',
    notIpucu: 'İsteğe bağlı; geçmişte görünür'
  }); }).then(function(s){
    if (!s) return;
    return Promise.resolve(UDV.vakalar.durum(vaka.id, d, s.not)).then(function(){
      YON.toast('Durum “' + ad + '” oldu.', 'ok');
      return yukle(false);
    });
  }).catch(function(err){ hata(err, 'Durum değiştirilemedi.'); });
}

function sil(){
  YON.onay({
    baslik: 'Taslak silinsin mi?',
    metin: '“' + vaka.baslik + '” kalıcı olarak silinir. Bu işlem geri alınamaz.',
    eylem: 'Sil',
    tehlike: true
  }).then(function(s){
    if (!s) return;
    return Promise.resolve(UDV.vakalar.sil(vaka.id)).then(function(){
      YON.sonrakiBildirim('Taslak silindi.', 'ok');
      location.href = '../';
    });
  }).catch(function(err){ hata(err, 'Vaka silinemedi.'); });
}

// what the save bar says: whether the form differs from what is saved, and when it was last saved
function kayitDurumu(degisti, metin){
  var d = $('#kayit-durum');
  if (!d) return;
  d.classList.toggle('degisti', degisti);
  d.textContent = metin || (degisti ? 'Kaydedilmemiş değişiklik var' : 'Değişiklik yok');
}

function kaydet(e){
  e.preventDefault();
  var form = e.currentTarget;
  var v = YON.formOku(form), h = YON.formDogrula(v);
  if (Object.keys(h).length) return YON.formHatalari(form, h);
  var btn = form.querySelector('button[type="submit"]');
  btn.disabled = true;
  Promise.resolve().then(function(){ return UDV.vakalar.guncelle(vaka.id, v); }).then(function(g){
    vaka = Object.assign({}, vaka, g || {});
    kayitDurumu(false, 'Kaydedildi · ' + YON.tarihSaat(new Date().toISOString()));
    YON.toast('Kaydedildi.', 'ok');
    ustYaz();
  }).catch(function(err){
    hata(err, 'Kaydedilemedi.');
  }).then(function(){ btn.disabled = false; });
}

// ----------------------------------------------------------- fikirler
// ----------------------------------------------------------- kâğıttan fikir
// The brochure asks people to write their idea on paper and drop it in a box. Each paper is typed in here: it joins
// the case like any idea (the name is what the site shows), the contact stays in the admin panel only.
// The form stays open after a save, ready for the next paper; the source is kept.
var kagitHazir = false;
function kagitFormu(){
  var kap = $('#kagit-kap');
  if (kagitHazir || !kap) return;
  kagitHazir = true;
  kap.innerHTML = '<details class="kagit" id="kagit"><summary class="btn alt sm">Kâğıttan fikir ekle</summary>' +
    '<form id="kagit-form" class="kagit-form" novalidate>' +
      '<p class="not">Broşürle kâğıda yazılıp kutuya bırakılan fikirleri buraya gir. Fikir sitede herkesinki gibi görünür, ' +
        '“alırdım” alır ve sıralamaya girer; iletişim bilgisi yalnız burada, yönetimde görünür.</p>' +
      '<label class="alan"><span>Fikir <small>10–140 karakter, kâğıttaki gibi</small></span><input type="text" name="baslik" maxlength="140" required autocomplete="off"></label>' +
      '<div class="alan-iki"><label class="alan"><span>Hangi derdi çözüyor <small>isteğe bağlı</small></span><textarea name="problem" rows="2" maxlength="400"></textarea></label>' +
      '<label class="alan"><span>Nasıl <small>isteğe bağlı; çizim varsa kısaca anlat</small></span><textarea name="cozum" rows="2" maxlength="400"></textarea></label></div>' +
      '<div class="alan-iki"><label class="alan"><span>Sitede görünen ad <small>ör. Ayşe K.; boş = adsız</small></span><input type="text" name="ad" maxlength="30" autocomplete="off"></label>' +
      '<label class="alan"><span>İletişim <small>e-posta, LinkedIn ya da telefon; yalnız yönetimde</small></span><input type="text" name="iletisim" maxlength="200" autocomplete="off"></label></div>' +
      '<div class="alan-iki"><label class="alan"><span>Nereden geldi</span><select name="kaynak"><option value="">Belirtilmedi</option></select></label>' +
      '<label class="alan"><span>Not <small>isteğe bağlı, yalnız yönetimde</small></span><input type="text" name="not" maxlength="500" autocomplete="off"></label></div>' +
      '<div class="y-eylem"><button class="btn sig" type="submit">Kaydet, sıradakine geç</button><span class="kagit-sayac" id="kagit-sayac" aria-live="polite"></span></div>' +
    '</form></details>';
  var f = $('#kagit-form'), say = 0;
  // the tracked links (Ne kadar çalıştı); the brochure is chosen when it exists
  Promise.resolve().then(function(){ return UDV.kaynak.rapor(); }).then(function(l){
    f.kaynak.innerHTML += l.map(function(k){ return '<option value="' + esc(k.id) + '">' + esc(k.baslik || k.id) + '</option>'; }).join('');
    if (l.some(function(k){ return k.id === 'brosur'; })) f.kaynak.value = 'brosur';
  }).catch(function(){});
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var b = f.querySelector('[type=submit]'); b.disabled = true;
    var x = { baslik:f.baslik.value, problem:f.problem.value, cozum:f.cozum.value, ad:f.ad.value, iletisim:f.iletisim.value, kaynak:f.kaynak.value, not:f.not.value };
    Promise.resolve().then(function(){ return UDV.kagit.ekle(vaka.id, x); }).then(function(){
      say++;
      ['baslik', 'problem', 'cozum', 'ad', 'iletisim', 'not'].forEach(function(n){ f[n].value = ''; });
      $('#kagit-sayac').textContent = 'Bu oturumda ' + say + ' kâğıt girildi.';
      YON.toast('Fikir eklendi.', 'ok');
      f.baslik.focus();
      return fikirleriYaz();
    }).catch(function(err){ hata(err, 'Fikir eklenemedi.'); }).then(function(){ b.disabled = false; });
  });
}

function fikirleriYaz(){
  var kap = $('#fikirler');
  kagitFormu();
  return Promise.all([UDV.fikirler.vaka(vaka.id), UDV.kagit.liste().catch(function(){ return {}; })]).then(function(r){
    var liste = r[0], kagit = r[1] || {};
    fikirListesi = liste;
    if (!liste.length){
      kap.innerHTML = '<div class="bos"><b>Henüz fikir yok</b>' +
        '<p>Fikirler burada görünür. Vaka sayfasını paylaşarak fikir topla.</p>' +
        '<a class="btn alt sm" href="../../vaka/?id=' + enc(vaka.id) + '">Sitede gör</a></div>';
      return;
    }
    var degerlendirme = vaka.durum === 'degerlendirme';
    kap.innerHTML = '<div class="tablo-kap"><table class="tablo">' +
      '<caption class="sr-only">Bu vakaya gelen fikirler</caption>' +
      '<thead><tr><th scope="col">Başlık</th><th scope="col">Ad</th>' +
      '<th scope="col" class="sayi">Alıcı</th><th scope="col" class="sayi">Ort. fiyat</th>' +
      '<th scope="col" class="sayi">Yorum</th><th scope="col">Sitede</th><th scope="col"><span class="sr-only">İşlem</span></th></tr></thead>' +
      '<tbody>' + liste.map(function(f){
        var kazanan = vaka.kazanan && vaka.kazanan === f.id;
        var islem = kazanan ? '<span class="rozet yesil">Kazanan</span>' :
          (degerlendirme ? '<button type="button" class="btn alt sm" data-kazanan="' + esc(f.id) + '">Kazanan seç</button>' : '');
        return '<tr>' +
          '<td>' + esc(f.baslik) + (kagit[f.id] ? ' <span class="rozet kagit-rozet" title="Kâğıda yazılıp kutuya bırakıldı">Kâğıt</span>' : '') + '</td>' +
          '<td>' + esc(f.ad || '—') + (kagit[f.id] && kagit[f.id].iletisim ? '<small class="kagit-iletisim">' + esc(kagit[f.id].iletisim) + '</small>' : '') + '</td>' +
          '<td class="sayi">' + sayi(f.alici) + '</td>' +
          '<td class="sayi">' + (f.alici ? tutar(f.ortFiyat) : '—') + '</td>' +
          '<td class="sayi">' + sayi(f.yorum) + '</td>' +
          // the idea's real state and one verb; the row is read back after the save
          '<td><div class="gorunur">' + (f.gizli ? '<span class="rozet kirmizi">Gizli</span>' : '<span class="rozet yesil">Yayında</span>') +
            '<button type="button" class="btn alt sm" data-gizle="' + esc(f.id) + '" data-yeni="' + (f.gizli ? '0' : '1') + '" aria-label="' + esc(f.baslik) + ': ' + (f.gizli ? 'yayına al' : 'gizle') + '">' +
            (f.gizli ? 'Yayına al' : 'Gizle') + '</button></div></td>' +
          '<td>' + islem + '</td>' +
        '</tr>';
      }).join('') + '</tbody></table></div>';
    YON.kartla(kap);
  }).catch(function(err){
    kap.innerHTML = '<p class="lead">Fikirler yüklenemedi.</p>';
    hata(err, 'Fikirler yüklenemedi.');
  });
}

function gizleTikla(e){
  var b = e.target.closest('[data-gizle]');
  if (!b) return;
  var gizli = b.dataset.yeni === '1';
  b.disabled = true; b.textContent = 'Kaydediliyor…';
  Promise.resolve().then(function(){ return UDV.fikirler.gizle(b.dataset.gizle, gizli); }).then(function(){
    YON.toast(gizli ? 'Fikir gizlendi.' : 'Fikir yeniden yayında.', 'ok');
  }, function(err){ hata(err, 'Güncellenemedi.'); }).then(fikirleriYaz);
}

function kazananTikla(e){
  var b = e.target.closest('[data-kazanan]');
  if (!b) return;
  var f = fikirListesi.find(function(x){ return x.id === b.dataset.kazanan; });
  if (!f) return;
  YON.onay({
    baslik: 'Kazanan seçilsin mi?',
    metin: '“' + f.baslik + '” kazanan olacak ve vaka “' + UDV.DURUM_ADI.kazanan + '” durumuna geçecek.',
    eylem: 'Kazananı seç'
  }).then(function(s){
    if (!s) return;
    return Promise.resolve(UDV.fikirler.kazanan(vaka.id, f.id)).then(function(){
      YON.toast('Kazanan seçildi.', 'ok');
      return yukle(false);
    });
  }).catch(function(err){ hata(err, 'Kazanan seçilemedi.'); });
}

// ----------------------------------------------------------- geçmiş ve dışa aktarma
function gecmisYaz(){
  var kap = $('#gecmis');
  return Promise.resolve().then(function(){ return UDV.vakalar.gecmis(vaka.id); }).then(function(g){
    if (!g.length){
      kap.innerHTML = '<div class="bos"><b>Henüz kayıt yok</b><p>Durum değişiklikleri burada sırayla listelenir.</p></div>';
      return;
    }
    kap.innerHTML = '<ol class="zaman-cizelgesi">' + g.map(function(s){
      return '<li><b>' + esc(YON.durumAdi(s.durum)) + '</b>' +
        '<span>' + esc(YON.tarihSaat(s.zaman)) + ' · ' + esc(s.kim || '—') + '</span>' +
        (s.not ? '<p>' + esc(s.not) + '</p>' : '') + '</li>';
    }).join('') + '</ol>';
  }).catch(function(err){
    kap.innerHTML = '<p class="lead">Geçmiş yüklenemedi.</p>';
    hata(err, 'Geçmiş yüklenemedi.');
  });
}

function csvIndir(){
  Promise.resolve().then(function(){ return UDV.csv(vaka.id); }).then(function(metin){
    var blob = new Blob([metin], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = vaka.id + '-fikirler.csv';
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    YON.toast('CSV indirildi.', 'ok');
  }).catch(function(err){ hata(err, 'CSV hazırlanamadı.'); });
}

YON.guard(ciz);
})();
</script>
</body>
</html>
